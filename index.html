<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>آرشیو کتب، مقالات و متن دروس استاد میلانی (حفظه‌الله)</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      color: #1f2937;
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.9;
    }

    .container {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      color: #173b63;
      font-size: clamp(1.55rem, 4vw, 2.35rem);
    }

    .subtitle {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 0.98rem;
    }

    .search-box {
      display: block;
      width: 100%;
      margin: 22px 0 8px;
      padding: 14px 18px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #fff;
      color: #1f2937;
      font: inherit;
      font-size: 1rem;
    }

    .search-box:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .search-status {
      min-height: 28px;
      margin: 0 0 20px;
      color: #64748b;
      font-size: 0.9rem;
    }

    .tree {
      background: #fff;
      border: 1px solid #dbe3ee;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }

    details {
      border-bottom: 1px solid #e5e7eb;
    }

    details:last-child {
      border-bottom: 0;
    }

    summary {
      padding: 17px 20px;
      cursor: pointer;
      list-style: none;
      font-weight: bold;
      color: #173b63;
      user-select: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::before {
      content: "＋";
      display: inline-block;
      width: 28px;
      color: #2563eb;
      font-size: 1.25rem;
      vertical-align: middle;
    }

    details[open] > summary::before {
      content: "−";
    }

    .branch-content {
      padding: 0 20px 20px;
    }

    .book-list {
      margin: 0;
      padding: 0 20px 14px 0;
      list-style: none;
    }

    .book-list li {
      border-top: 1px solid #edf2f7;
    }

    .book-list a {
      display: block;
      padding: 11px 10px;
      color: #1d4ed8;
      text-decoration: none;
      border-radius: 7px;
    }

    .book-list a:hover {
      background: #eff6ff;
      text-decoration: underline;
    }

    .book-list a::before {
      content: "HTML";
      display: inline-block;
      margin-left: 9px;
      padding: 1px 7px;
      border-radius: 5px;
      background: #dcfce7;
      color: #166534;
      font-size: 0.72rem;
      font-weight: bold;
      direction: ltr;
    }

    .hidden {
      display: none !important;
    }

    .text-search-results {
      margin-top: 22px;
    }

    .result-count {
      margin: 0 0 10px;
      color: #475569;
      font-size: 0.92rem;
    }

    .text-search-result {
      margin-top: 12px;
      padding: 15px;
      border: 1px solid #dbe3ee;
      border-radius: 11px;
      background: #fff;
    }

    .result-title {
      display: block;
      color: #1d4ed8;
      font-weight: bold;
      text-decoration: none;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .text-search-result p {
      margin: 10px 0 0;
      color: #475569;
      font-size: 0.93rem;
      line-height: 2;
    }

    .found-word-link {
      display: inline-block;
      margin-top: 8px;
      color: #1d4ed8;
      font-size: 0.9rem;
      font-weight: bold;
      text-decoration: none;
    }

    .found-word-link:hover {
      text-decoration: underline;
    }

    mark {
      padding: 1px 3px;
      border-radius: 3px;
      background: #fde68a;
      color: inherit;
    }

    #noResults {
      display: none;
      margin: 18px 0 0;
      padding: 13px 15px;
      border-radius: 10px;
      background: #fff7ed;
      color: #9a3412;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>آرشیو کتب، مقالات و متن دروس استاد میلانی (حفظه‌الله)</h1>
      <p class="subtitle">دسترسی و جست‌وجو در عنوان‌ها و متن دروس آرشیو</p>
    </header>

    <input
      id="siteSearch"
      class="search-box"
      type="search"
      placeholder="جست‌وجو در عنوان‌ها و متن درس‌ها…"
      aria-label="جست‌وجو در منابع و متن دروس">

    <p id="searchStatus" class="search-status">
      در حال آماده‌سازی جست‌وجوی متون…
    </p>

    <section class="tree" aria-label="فهرست منابع">
      <details class="main-branch" open>
        <summary>دروس و متون</summary>

        <div class="branch-content">
          <ul class="book-list">
            <li
              class="searchable-item"
              data-title="متن درس معرفة الله محشی معرفت الله"
              data-url="marefatollah-mohashsha.htm">

              <a
                href="marefatollah-mohashsha.htm"
                target="_blank"
                rel="noopener">
                متن درس معرفة الله (محشّی)
              </a>
            </li>
          </ul>
        </div>
      </details>
    </section>

    <section
      id="searchResults"
      class="text-search-results"
      aria-live="polite">
    </section>

    <p id="noResults">
      نتیجه‌ای در عنوان‌ها یا متن درس‌ها پیدا نشد.
    </p>
  </main>

  <script>
    const searchInput = document.getElementById("siteSearch");
    const searchStatus = document.getElementById("searchStatus");
    const searchResults = document.getElementById("searchResults");
    const noResults = document.getElementById("noResults");
    const searchableItems = [...document.querySelectorAll(".searchable-item")];

    const documents = [];
    const maximumResults = 300;

    function normalize(text) {
      return (text || "")
        .toLowerCase()
        .replace(/[يى]/g, "ی")
        .replace(/ك/g, "ک")
        .replace(/ۀ/g, "ه")
        .replace(/ة/g, "ه")
        .replace(/\s+/g, " ")
        .trim();
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getTextFromHtml(html) {
      const parser = new DOMParser();
      const page = parser.parseFromString(html, "text/html");

      page.querySelectorAll(
        "script, style, noscript, svg, iframe, header, footer, nav"
      ).forEach(element => element.remove());

      return page.body
        ? page.body.textContent.replace(/\s+/g, " ").trim()
        : "";
    }

    function findAllMatches(text, query) {
      const cleanText = normalize(text);
      const cleanQuery = normalize(query);

      if (!cleanQuery) {
        return [];
      }

      const matches = [];
      let position = 0;

      while (true) {
        const foundAt = cleanText.indexOf(cleanQuery, position);

        if (foundAt === -1) {
          break;
        }

        matches.push(foundAt);
        position = foundAt + cleanQuery.length;

        if (matches.length >= maximumResults) {
          break;
        }
      }

      return matches;
    }

    function makeSnippet(text, position, query) {
      const plainText = (text || "").replace(/\s+/g, " ").trim();
      const cleanQuery = normalize(query);

      const start = Math.max(0, position - 115);
      const end = Math.min(
        plainText.length,
        position + cleanQuery.length + 155
      );

      return (start > 0 ? "… " : "") +
        plainText.slice(start, end).trim() +
        (end < plainText.length ? " …" : "");
    }

    function getWordsBefore(text, position, count = 7) {
      const beforeText = text.slice(Math.max(0, position - 160), position).trim();
      const words = beforeText.split(/\s+/).filter(Boolean);

      return words.slice(-count).join(" ");
    }

    function getWordsAfter(text, position, query, count = 7) {
      const start = position + normalize(query).length;
      const afterText = text.slice(start, start + 160).trim();
      const words = afterText.split(/\s+/).filter(Boolean);

      return words.slice(0, count).join(" ");
    }

    function makeTextFragmentUrl(url, text, position, query) {
      const prefix = getWordsBefore(text, position);
      const suffix = getWordsAfter(text, position, query);

      let fragment = "";

      if (prefix) {
        fragment += `${encodeURIComponent(prefix)}-`;
      }

      fragment += encodeURIComponent(query);

      if (suffix) {
        fragment += `-${encodeURIComponent(suffix)}`;
      }

      return `${url}#:~:text=${fragment}`;
    }

    function highlightSnippet(snippet, query) {
      const escapedSnippet = escapeHtml(snippet);
      const escapedQuery = escapeHtml(query);

      if (!escapedQuery) {
        return escapedSnippet;
      }

      const pattern = new RegExp(
        escapedQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
        "gi"
      );

      return escapedSnippet.replace(
        pattern,
        match => `<mark>${match}</mark>`
      );
    }

    async function loadTextDocuments() {
      const jobs = searchableItems.map(async item => {
        const link = item.querySelector("a");
        const title = item.dataset.title || link.textContent;
        const url = item.dataset.url || link.getAttribute("href");

        try {
          const response = await fetch(url);

          if (!response.ok) {
            throw new Error("File could not be loaded");
          }

          const html = await response.text();
          const text = getTextFromHtml(html);

          documents.push({
            title: title,
            url: url,
            text: text
          });
        } catch (error) {
          console.warn("Text file not loaded:", url, error);
        }
      });

      await Promise.all(jobs);

      if (documents.length > 0) {
        searchStatus.textContent =
          `جست‌وجو در متن ${documents.length} درس آماده است.`;
      } else {
        searchStatus.textContent =
          "متن درس بارگذاری نشد؛ فعلاً جست‌وجو فقط در عنوان انجام می‌شود.";
      }
    }

    function renderResults(query) {
      const cleanQuery = normalize(query);

      searchableItems.forEach(item => {
        const title = normalize(item.dataset.title || item.textContent);
        const titleMatched = !cleanQuery || title.includes(cleanQuery);

        item.classList.toggle("hidden", !titleMatched);
      });

      if (!cleanQuery) {
        searchResults.innerHTML = "";
        noResults.style.display = "none";
        return;
      }

      const allResults = [];

      documents.forEach(document => {
        const positions = findAllMatches(document.text, query);

        positions.forEach((position, index) => {
          const snippet = makeSnippet(document.text, position, query);
          const fragmentUrl = makeTextFragmentUrl(
            document.url,
            document.text,
            position,
            query
          );

          allResults.push({
            title: document.title,
            snippet: snippet,
            url: fragmentUrl,
            number: index + 1
          });
        });
      });

      if (allResults.length === 0) {
        searchResults.innerHTML = "";
        noResults.style.display = "block";
        return;
      }

      noResults.style.display = "none";

      const shownResults = allResults.slice(0, maximumResults);

      let resultCountText = `تعداد نتایج: ${allResults.length}`;

      if (allResults.length > maximumResults) {
        resultCountText += ` — فقط ${maximumResults} نتیجهٔ نخست نمایش داده شده است.`;
      }

      searchResults.innerHTML = `
        <p class="result-count">${resultCountText}</p>
        ${shownResults.map(result => `
          <article class="text-search-result">
            <a
              class="result-title"
              href="${result.url}"
              target="_blank"
              rel="noopener">
              ${escapeHtml(result.title)} — نتیجهٔ ${result.number}
            </a>

            <p>${highlightSnippet(result.snippet, query)}</p>

            <a
              class="found-word-link"
              href="${result.url}"
              target="_blank"
              rel="noopener">
              رفتن به همین عبارت: «${escapeHtml(query)}»
            </a>
          </article>
        `).join("")}
      `;
    }

    searchInput.addEventListener("input", function () {
      renderResults(this.value);
    });

    loadTextDocuments();
  </script>
</body>
</html>
