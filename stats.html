<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آمار سایت - آرشیو استاد میلانی</title>
<!--
  Item ۸ (آمار سایت): این صفحه فقط داده‌های آماده‌شده توسط Worker را
  (از endpoint GET /stats) نمایش می‌دهد؛ هیچ منطق شمارشی این‌جا نیست.

  نکته‌ی امنیتی مهم: این صفحه فعلاً هیچ رمز/محدودیتی ندارد - هرکسی
  آدرسش را بداند می‌تواند آمار را ببیند (نه چیز خطرناکی مثل کلید API،
  ولی شاید نخواهید عمومی باشد). اگر خواستید محدودش کنید، ساده‌ترین راه
  این است که در همین فایل یک رمز عبور ساده (که فقط خودتان می‌دانید)
  اضافه شود - در صورت نیاز بگویید تا اضافه کنم.
-->
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f1f5f9;
    color: #1f2937;
    padding: 24px 16px 60px;
  }

  h1 {
    color: #173b63;
    font-size: 1.3rem;
    text-align: center;
    margin-bottom: 24px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    max-width: 720px;
    margin: 0 auto 32px;
  }

  .stat-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
  }

  .stat-card .value {
    font-size: 1.8rem;
    font-weight: bold;
    color: #0f766e;
  }

  .stat-card .label {
    color: #64748b;
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .tables-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
    justify-content: center;
  }

  .table-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    flex: 1 1 380px;
    max-width: 420px;
  }

  .table-card h2 {
    font-size: 1rem;
    color: #173b63;
    margin: 0 0 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  th, td {
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid #eef2f7;
  }

  th {
    color: #64748b;
    font-weight: normal;
  }

  td.count {
    text-align: left;
    color: #0f766e;
    font-weight: bold;
    white-space: nowrap;
  }

  .status-note {
    text-align: center;
    color: #64748b;
    max-width: 500px;
    margin: 0 auto 20px;
  }

  .status-note.error {
    color: #b91c1c;
  }

  /* Item جدید (فیلتر تاریخ): نوار فیلتر بازهٔ تاریخ - روی سه بخش:
     ردیف ورودی‌های تاریخ + دکمهٔ نمایش، ردیف دکمه‌های آماده (پرش
     سریع)، و یک خط وضعیت که بازهٔ فعال را نشان می‌دهد. */
  .filter-bar {
    max-width: 720px;
    margin: 0 auto 20px;
    background: #ffffff;
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: end;
    justify-content: center;
  }

  .filter-row label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.8rem;
    color: #64748b;
  }

  .filter-row input[type="text"].jalali-date-input {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 6px 8px;
    border: 1px solid #d7dee7;
    border-radius: 8px;
    color: #1f2937;
    width: 110px;
    text-align: center;
    direction: ltr;
  }

  #applyFilterBtn {
    background: #0f766e;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-family: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }

  #applyFilterBtn:hover {
    background: #0d5f58;
  }

  .filter-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
  }

  .preset-btn {
    background: #eef2f7;
    color: #173b63;
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .preset-btn:hover {
    background: #dde5ee;
  }

  .preset-btn.active {
    background: #0f766e;
    color: #ffffff;
  }

  .filter-current {
    text-align: center;
    color: #64748b;
    font-size: 0.8rem;
    margin: 12px 0 0;
  }
</style>
</head>
<body>

<h1>📊 آمار سایت — آرشیو استاد میلانی</h1>

<div class="filter-bar" id="filterBar">
  <div class="filter-row">
    <label>از تاریخ (شمسی)<input type="text" class="jalali-date-input" id="fromDateInput" placeholder="۱۴۰۵/۰۶/۰۱" inputmode="numeric"></label>
    <label>تا تاریخ (شمسی)<input type="text" class="jalali-date-input" id="toDateInput" placeholder="۱۴۰۵/۰۶/۲۲" inputmode="numeric"></label>
    <button type="button" id="applyFilterBtn">نمایش</button>
  </div>
  <div class="filter-presets">
    <button type="button" class="preset-btn" data-preset="today">امروز</button>
    <button type="button" class="preset-btn" data-preset="7">۷ روز اخیر</button>
    <button type="button" class="preset-btn" data-preset="30">۳۰ روز اخیر</button>
    <button type="button" class="preset-btn" data-preset="all">کل بازه (پیش‌فرض)</button>
  </div>
  <p class="filter-current" id="filterCurrentLabel"></p>
</div>

<p class="status-note" id="statusNote">در حال بارگذاری آمار…</p>

<div class="stats-grid" id="statsGrid" style="display:none;">
  <div class="stat-card">
    <div class="value" id="statPageviews">۰</div>
    <div class="label">بازدید صفحه</div>
  </div>
  <div class="stat-card">
    <div class="value" id="statSearches">۰</div>
    <div class="label">جست‌وجو</div>
  </div>
  <div class="stat-card">
    <div class="value" id="statDownloads">۰</div>
    <div class="label">دانلود</div>
  </div>
</div>

<div class="tables-wrap" id="tablesWrap" style="display:none;">
  <div class="table-card">
    <h2>پرتکرارترین عبارت‌های جست‌وجوشده</h2>
    <table>
      <thead><tr><th>عبارت</th><th>تعداد</th></tr></thead>
      <tbody id="searchTermsBody"></tbody>
    </table>
  </div>

  <div class="table-card">
    <h2>پرتکرارترین فایل‌های دانلودشده</h2>
    <table>
      <thead><tr><th>فایل</th><th>تعداد</th></tr></thead>
      <tbody id="downloadFilesBody"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  "use strict";

  const WORKER_URL = "https://milani-archive-ai.mrooh200.workers.dev";

  // Item جدید (تقویم هجری شمسی): تبدیل تاریخ بین میلادی و شمسی، چون
  // ورودی‌های فیلتر حالا به شمسی گرفته می‌شن ولی خودِ Worker (و کلیدهای
  // ذخیره‌شده در KV) بر مبنای تاریخ میلادیِ روزِ تقویمیِ تهران کار
  // می‌کنن. الگوریتم استاندارد تبدیل (بر پایهٔ شمارهٔ روزِ ژولینی) -
  // بدون وابستگی به کتابخانهٔ خارجی.
  function div(a, b) { return Math.trunc(a / b); }
  function mod(a, b) { return a - Math.trunc(a / b) * b; }

  function jalCal(jy) {
    const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
    const bl = breaks.length;
    const gy = jy + 621;
    let leapJ = -14;
    let jp = breaks[0];

    if (jy < jp || jy >= breaks[bl - 1]) {
      throw new Error("سال شمسی نامعتبر: " + jy);
    }

    let jump = 0;
    let jm;
    for (let i = 1; i < bl; i += 1) {
      jm = breaks[i];
      jump = jm - jp;
      if (jy < jm) break;
      leapJ += div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }

    let n = jy - jp;
    leapJ += div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;

    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG;

    if (jump - n < 6) n = n - jump + div(jump, 33) * 33;

    let leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;

    return { leap, gy, march };
  }

  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4)
      + div(153 * mod(gm + 9, 12) + 2, 5)
      + gd - 34840408;
    d = d - div(div(gy + div(gm - 8, 6) + 100100, 100) * 3, 4) + 752;
    return d;
  }

  function d2g(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308;
    const gd = div(mod(i, 153), 5) + 1;
    const gm = mod(div(i, 153), 12) + 1;
    const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
    return [gy, gm, gd];
  }

  function j2d(jy, jm, jd) {
    const r = jalCal(jy);
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  }

  function d2j(jdn) {
    const gy = d2g(jdn)[0];
    let jy = gy - 621;
    const r = jalCal(jy);
    const jdn1f = g2d(gy, 3, r.march);
    let k = jdn - jdn1f;
    let jm, jd;

    if (k >= 0) {
      if (k <= 185) {
        jm = 1 + div(k, 31);
        jd = mod(k, 31) + 1;
        return [jy, jm, jd];
      }
      k -= 186;
    } else {
      jy -= 1;
      k += 179;
      if (r.leap === 1) k += 1;
    }

    jm = 7 + div(k, 30);
    jd = mod(k, 30) + 1;
    return [jy, jm, jd];
  }

  function gregorianToJalali(gy, gm, gd) { return d2j(g2d(gy, gm, gd)); }
  function jalaliToGregorian(jy, jm, jd) { return d2g(j2d(jy, jm, jd)); }

  function toPersianDigits(num) {
    return String(num).replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
  }

  function toAsciiDigits(text) {
    const persian = "۰۱۲۳۴۵۶۷۸۹";
    const arabic = "٠١٢٣٤٥٦٧٨٩";
    return String(text).replace(/[۰-۹٠-٩]/g, ch => {
      const pIndex = persian.indexOf(ch);
      if (pIndex !== -1) return String(pIndex);
      const aIndex = arabic.indexOf(ch);
      return aIndex !== -1 ? String(aIndex) : ch;
    });
  }

  // یک رشتهٔ تاریخِ میلادیِ YYYY-MM-DD رو به رشتهٔ نمایشیِ شمسی (با
  // ارقام فارسی، برای گذاشتن داخل ورودی‌های فیلتر) تبدیل می‌کنه.
  function isoGregorianToJalaliDisplay(isoStr) {
    const [gy, gm, gd] = isoStr.split("-").map(n => parseInt(n, 10));
    const [jy, jm, jd] = gregorianToJalali(gy, gm, gd);
    return toPersianDigits(`${jy}/${String(jm).padStart(2, "0")}/${String(jd).padStart(2, "0")}`);
  }

  // متن تایپ‌شده توسط کاربر (شمسی، با ارقام فارسی یا انگلیسی، با جداکنندهٔ
  // / یا - یا فاصله) رو می‌گیره و رشتهٔ میلادیِ YYYY-MM-DD برمی‌گردونه؛
  // اگه نامعتبر بود null برمی‌گردونه (نه این‌که خطا پرتاب کنه).
  function jalaliInputToIsoGregorian(text) {
    const clean = toAsciiDigits(String(text).trim()).replace(/[\s.]+/g, "/").replace(/-/g, "/");
    const match = clean.match(/^(\d{3,4})\/(\d{1,2})\/(\d{1,2})$/);
    if (!match) return null;

    const jy = parseInt(match[1], 10);
    const jm = parseInt(match[2], 10);
    const jd = parseInt(match[3], 10);

    if (jm < 1 || jm > 12 || jd < 1 || jd > 31) return null;

    try {
      const [gy, gm, gd] = jalaliToGregorian(jy, jm, jd);
      // اعتبارسنجی رفت‌وبرگشتی: اگه jd روزی بود که در این ماه/سال وجود
      // نداره (مثلاً ۳۰ اسفند در سال غیرکبیسه)، تبدیل رفت‌وبرگشت به
      // ورودیِ اصلی نمی‌رسه - این‌جا رد می‌کنیم.
      const [jy2, jm2, jd2] = gregorianToJalali(gy, gm, gd);
      if (jy2 !== jy || jm2 !== jm || jd2 !== jd) return null;

      const year = String(gy).padStart(4, "0");
      const month = String(gm).padStart(2, "0");
      const day = String(gd).padStart(2, "0");
      return `${year}-${month}-${day}`;
    } catch {
      return null;
    }
  }

  // Item جدید (فیلتر تاریخ): وضعیت فعلیِ بازهٔ انتخابی (همیشه به شکل
  // میلادیِ YYYY-MM-DD - همون چیزی که Worker می‌فهمه). مقدار null یعنی
  // «کل بازه» (بدون فیلتر - همون رفتار قبلی، سازگار با نسخهٔ قدیمی
  // Worker هم هست، چون وقتی from/to فرستاده نشه، Worker مجموع کل رو
  // برمی‌گردونه).
  let currentFrom = null;
  let currentTo = null;

  function toIsoDateString(date) {
    // تاریخِ محلیِ مرورگر کاربر رو به شکل YYYY-MM-DD تبدیل می‌کنه (نه
    // toISOString که به UTC تبدیل می‌کنه و ممکنه یک روز عقب/جلو بشه).
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function daysAgoDateString(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return toIsoDateString(d);
  }

  function escapeHtml(text) {
    return String(text || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function fillTable(bodyEl, entries, labelKey) {
    if (!entries || entries.length === 0) {
      bodyEl.innerHTML = `<tr><td colspan="2" style="color:#94a3b8;">هنوز داده‌ای ثبت نشده</td></tr>`;
      return;
    }
    bodyEl.innerHTML = entries
      .map(item => `
        <tr>
          <td>${escapeHtml(item[labelKey])}</td>
          <td class="count">${toPersianDigits(item.count)}</td>
        </tr>
      `)
      .join("");
  }

  async function loadStats() {
    const statusNote = document.getElementById("statusNote");
    statusNote.className = "status-note";
    statusNote.textContent = "در حال بارگذاری آمار…";
    statusNote.style.display = "block";
    document.getElementById("statsGrid").style.display = "none";
    document.getElementById("tablesWrap").style.display = "none";

    try {
      // Item جدید (فیلتر تاریخ): وقتی currentFrom/currentTo پر باشن،
      // به‌عنوان پارامتر به Worker فرستاده می‌شن؛ Worker خودش تشخیص
      // می‌ده و فقط مجموع همون بازه رو برمی‌گردونه.
      const query = currentFrom && currentTo
        ? `?from=${encodeURIComponent(currentFrom)}&to=${encodeURIComponent(currentTo)}`
        : "";

      const res = await fetch(`${WORKER_URL}/stats${query}`);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `خطای سرور (${res.status})`);
      }
      const data = await res.json();

      document.getElementById("statPageviews").textContent = toPersianDigits(data.pageviews || 0);
      document.getElementById("statSearches").textContent = toPersianDigits(data.searches || 0);
      document.getElementById("statDownloads").textContent = toPersianDigits(data.downloads || 0);

      fillTable(document.getElementById("searchTermsBody"), data.topSearchTerms, "value");
      fillTable(document.getElementById("downloadFilesBody"), data.topDownloadFiles, "value");

      statusNote.style.display = "none";
      document.getElementById("statsGrid").style.display = "grid";
      document.getElementById("tablesWrap").style.display = "flex";
    } catch (err) {
      statusNote.className = "status-note error";
      statusNote.textContent = "دریافت آمار ناموفق بود: " + err.message;
    }
  }

  // Item جدید (فیلتر تاریخ): وقتی یک دکمهٔ آماده (امروز/۷ روز/۳۰ روز/کل
  // بازه) زده می‌شه، هم ورودی‌های تاریخ رو پر می‌کنه و هم بلافاصله
  // آمار رو دوباره می‌خونه؛ دکمهٔ «نمایش» هم برای وقتی هست که کاربر
  // خودش دستی یک بازهٔ دلخواه در ورودی‌ها انتخاب کرده.
  function setActivePresetButton(presetKey) {
    document.querySelectorAll(".preset-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.preset === presetKey);
    });
  }

  function updateFilterCurrentLabel() {
    const label = document.getElementById("filterCurrentLabel");
    label.textContent = currentFrom && currentTo
      ? `بازهٔ نمایش‌داده‌شده: ${isoGregorianToJalaliDisplay(currentFrom)} تا ${isoGregorianToJalaliDisplay(currentTo)}`
      : "بازهٔ نمایش‌داده‌شده: از ابتدا تا الان (بدون فیلتر)";
  }

  function applyPreset(presetKey) {
    const fromInput = document.getElementById("fromDateInput");
    const toInput = document.getElementById("toDateInput");

    if (presetKey === "all") {
      currentFrom = null;
      currentTo = null;
      fromInput.value = "";
      toInput.value = "";
    } else if (presetKey === "today") {
      const today = toIsoDateString(new Date());
      currentFrom = today;
      currentTo = today;
      fromInput.value = isoGregorianToJalaliDisplay(today);
      toInput.value = isoGregorianToJalaliDisplay(today);
    } else {
      const n = parseInt(presetKey, 10);
      currentFrom = daysAgoDateString(n - 1);
      currentTo = toIsoDateString(new Date());
      fromInput.value = isoGregorianToJalaliDisplay(currentFrom);
      toInput.value = isoGregorianToJalaliDisplay(currentTo);
    }

    setActivePresetButton(presetKey);
    updateFilterCurrentLabel();
    loadStats();
  }

  document.querySelectorAll(".preset-btn").forEach(btn => {
    btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
  });

  document.getElementById("applyFilterBtn").addEventListener("click", () => {
    const fromText = document.getElementById("fromDateInput").value.trim();
    const toText = document.getElementById("toDateInput").value.trim();

    if (!fromText || !toText) {
      // اگه کاربر هر دو تاریخ رو پاک کرده باشه، یعنی می‌خواد فیلتر
      // برداشته بشه - مثل زدن دکمهٔ «کل بازه».
      applyPreset("all");
      return;
    }

    const fromValue = jalaliInputToIsoGregorian(fromText);
    const toValue = jalaliInputToIsoGregorian(toText);

    if (!fromValue || !toValue) {
      alert("تاریخ را به‌صورت شمسی و به شکل سال/ماه/روز وارد کنید - مثلاً ۱۴۰۵/۰۶/۰۱");
      return;
    }

    if (fromValue > toValue) {
      alert("تاریخ «از» نباید بعد از تاریخ «تا» باشد.");
      return;
    }

    currentFrom = fromValue;
    currentTo = toValue;
    setActivePresetButton(null);
    updateFilterCurrentLabel();
    loadStats();
  });

  updateFilterCurrentLabel();
  setActivePresetButton("all");
  loadStats();
})();
</script>

</body>
</html>
