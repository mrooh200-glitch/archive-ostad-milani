<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نمایشگر PDF</title>

<style>
  * { box-sizing: border-box; }

  /* Item جدید: حالت شب - هماهنگ با بقیهٔ سایت. کل صفحه (بدنه + canvas
     رندرشدهٔ PDF) معکوس می‌شود تا واقعاً به‌شکل تیره خوانده شود؛ فقط
     خودِ رابط جستجو (که نباید معکوس به‌نظر برسد) دوباره معکوس می‌شود
     تا رنگ عادی خودش را نگه دارد. */
  html.pdf-dark-mode {
    filter: invert(1) hue-rotate(180deg);
  }

  html.pdf-dark-mode #searchBox,
  html.pdf-dark-mode #resultsPanel,
  html.pdf-dark-mode #pickerScreen {
    filter: invert(1) hue-rotate(180deg);
  }

  .dark-mode-toggle {
    flex-shrink: 0;
  }

  html.pdf-dark-mode #settingsMenu,
  html.pdf-dark-mode #archiveOverlay,
  html.pdf-dark-mode #bookmarksOverlay,
  html.pdf-dark-mode #tagPopover {
    filter: invert(1) hue-rotate(180deg);
  }

  .settings-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .settings-gear {
    padding: 5px 9px !important;
    font-size: 0.95rem !important;
    line-height: 1;
  }

  .settings-menu {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10002;
    width: 240px;
    max-width: 88vw;
    max-height: 70vh;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    box-shadow: 0 10px 26px rgba(15, 23, 42, 0.20);
    padding: 6px;
    font-family: Tahoma, Arial, sans-serif;
    direction: rtl;
    text-align: right;
  }

  .settings-menu.is-open {
    display: block;
  }

  .settings-menu button.settings-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    padding: 7px 9px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: #1f2937;
    font: inherit;
    font-size: 0.84rem;
    text-align: right;
    cursor: pointer;
  }

  .settings-menu button.settings-item:hover:not(:disabled) {
    background: #eff6ff;
  }

  .settings-menu button.settings-item:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .settings-menu .settings-badge {
    color: #64748b;
    font-size: 0.72rem;
  }

  .settings-separator {
    height: 1px;
    margin: 5px 2px;
    background: #e2e8f0;
  }

  .settings-section-label {
    padding: 6px 9px 2px;
    color: #94a3b8;
    font-size: 0.68rem;
    font-weight: bold;
  }

  .settings-menu label.settings-radio,
  .settings-menu label.settings-checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px;
    font-size: 0.82rem;
    color: #1f2937;
    cursor: pointer;
  }

  .settings-proximity-distance {
    width: 42px;
    margin-inline-start: 4px;
    padding: 2px 4px;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    font: inherit;
  }

  .reading-size-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 4px 9px 8px;
  }

  .reading-size-row button {
    flex: 1;
    padding: 6px 0;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #f8fafc;
    color: #1f2937;
    cursor: pointer;
    font: inherit;
    font-size: 0.9rem;
  }

  .reading-size-row button:hover {
    background: #eff6ff;
  }

  .reading-size-label {
    flex: 0 0 auto;
    min-width: 34px;
    text-align: center;
    color: #64748b;
    font-size: 0.78rem;
  }

  /* Item جدید: آرشیو/نشانه‌ها - هم‌ساختار با پنل‌های مشابه در بقیهٔ سایت */
  #archiveOverlay,
  #bookmarksOverlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10001;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.45);
  }

  #archiveOverlay.open,
  #bookmarksOverlay.open {
    display: flex;
  }

  #archivePanel,
  #bookmarksPanel {
    width: min(560px, 100%);
    max-height: 80vh;
    overflow-y: auto;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    font-family: Tahoma, Arial, sans-serif;
    direction: rtl;
    text-align: right;
  }

  .archive-header {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #173b63;
    font-weight: bold;
  }

  .archive-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .archive-header-actions button {
    border: 1px solid #93c5fd;
    border-radius: 6px;
    background: #eff6ff;
    color: #1d4ed8;
    font: inherit;
    font-size: 0.74rem;
    padding: 4px 8px;
    cursor: pointer;
  }

  .archive-header-actions button:hover {
    background: #dbeafe;
  }

  .archive-item {
    padding: 10px 16px;
    border-bottom: 1px solid #eef2f7;
  }

  .archive-item:last-child {
    border-bottom: none;
  }

  .archive-item-text {
    margin: 0 0 6px;
    color: #334155;
    font-size: 0.86rem;
    line-height: 1.8;
  }

  .archive-item-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 0 0 6px;
  }

  .archive-item-tag {
    padding: 2px 8px;
    border-radius: 999px;
    background: #eff6ff;
    color: #1d4ed8;
    font-size: 0.7rem;
  }

  .archive-item-actions {
    display: flex;
    gap: 8px;
  }

  .archive-item-actions a,
  .archive-item-actions button {
    border: 1px solid #93c5fd;
    border-radius: 6px;
    background: #eff6ff;
    color: #1d4ed8;
    font: inherit;
    font-size: 0.74rem;
    padding: 4px 8px;
    cursor: pointer;
    text-decoration: none;
  }

  .archive-item-actions a:hover,
  .archive-item-actions button:hover {
    background: #dbeafe;
  }

  .archive-empty {
    padding: 26px 16px;
    color: #64748b;
    text-align: center;
    font-size: 0.86rem;
  }

  .bookmark-tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid #eef2f7;
  }

  .bookmark-tag-chip {
    padding: 3px 10px;
    border: 1px solid #c4b5fd;
    border-radius: 999px;
    background: #f5f3ff;
    color: #6d28d9;
    font: inherit;
    font-size: 0.72rem;
    cursor: pointer;
  }

  .bookmark-tag-chip:hover {
    background: #ede9fe;
  }

  .bookmark-tag-chip.is-active {
    background: #6d28d9;
    border-color: #6d28d9;
    color: #ffffff;
  }

  .archive-book-group-title {
    padding: 10px 16px 2px;
    color: #94a3b8;
    font-size: 0.72rem;
    font-weight: bold;
  }

  /* Item جدید: پاپ‌آور برچسب («افزودن نشانه به انتخاب‌شده‌ها») */
  .tag-popover {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10003;
    width: 240px;
    max-width: 90vw;
    padding: 10px;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    box-shadow: 0 10px 26px rgba(15, 23, 42, 0.22);
    font-family: Tahoma, Arial, sans-serif;
    direction: rtl;
    text-align: right;
  }

  .tag-popover.is-open {
    display: block;
  }

  .tag-popover input {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font: inherit;
    font-size: 0.86rem;
    margin-bottom: 8px;
  }

  .tag-popover-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .tag-popover-actions button {
    padding: 6px 12px;
    border: 1px solid #93c5fd;
    border-radius: 6px;
    background: #eff6ff;
    color: #1d4ed8;
    cursor: pointer;
    font: inherit;
    font-size: 0.8rem;
  }

  .tag-popover-actions button:hover {
    background: #dbeafe;
  }

  #tagCancel {
    background: transparent;
    border-color: #cbd5e1;
    color: #64748b;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #eef2f7;
    color: #1f2937;
    font-family: Tahoma, Arial, sans-serif;
  }

  #searchBox {
    position: sticky;
    top: 0;
    z-index: 500;
    box-sizing: border-box;
    padding: 10px 14px;
    border-bottom: 1px solid #cbd5e1;
    background: #ffffff;
    box-shadow: 0 3px 10px rgba(15, 23, 42, 0.10);
    direction: rtl;
    text-align: right;
  }

  #pdfTitle {
    color: #b45309;
    font-size: 0.95rem;
    font-weight: bold;
    white-space: nowrap;
    flex: 0 1 auto;
    min-width: 24px;
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-inline-end: 8px;
    border-inline-end: 2px solid #2563eb;
  }

  .search-row {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    align-items: center;
    gap: 8px;
    width: min(1100px, 100%);
    margin: 0 auto;
  }

  .search-row label {
    color: #173b63;
    font-size: 0.92rem;
    font-weight: bold;
  }

  .search-input-wrap {
    position: relative;
    flex: 1 1 220px;
    min-width: 140px;
  }

  .search-input-wrap #searchInput {
    width: 100%;
  }

  /* Item جدید: دراپ‌داون جست‌وجوهای اخیر - position:fixed لازم است چون
     .search-row بالادستش overflow-x:auto دارد که طبق مشخصات CSS باعث
     می‌شود overflow-y هم auto شود و هر فرزند absolute را برش بزند. */
  .search-history {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 10002;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.15);
    padding: 6px 8px;
  }

  .search-history.is-open {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 8px;
  }

  .search-history-label {
    flex: 0 0 auto;
    color: #94a3b8;
    font-size: 0.7rem;
    font-weight: bold;
    white-space: nowrap;
  }

  .search-history-item {
    flex: 0 0 auto;
    box-sizing: border-box;
    padding: 4px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #f8fafc;
    color: #173b63;
    font: inherit;
    font-size: 0.7rem;
    white-space: nowrap;
    cursor: pointer;
  }

  .search-history-item:hover {
    background: #eff6ff;
    border-color: #93c5fd;
  }

  /* Item جدید: دکمهٔ نمایش/پنهان‌کردن گزینه‌ها، همیشه دیده می‌شود؛ بقیهٔ
     گزینه‌ها (قبلی/بعدی/ریشه‌ای/صدا/⚙️) پیش‌فرض پنهان‌اند. با کلیک روی
     این دکمه، چون extra-controls همان داخل .search-row قرار دارد (نه
     ردیف جدا)، خودِ کادر جستجو جمع‌وجورتر می‌شود تا جا برای بقیهٔ
     گزینه‌ها در همان خط اول باز شود. */
  .options-toggle {
    flex-shrink: 0;
    padding: 5px 10px !important;
    font-size: 0.95rem !important;
  }

  .options-toggle.is-active {
    background: #dbeafe !important;
    border-color: #2563eb !important;
  }

  .extra-controls {
    display: none;
    flex-wrap: nowrap;
    align-items: center;
    gap: 8px;
  }

  .extra-controls.is-visible {
    display: flex;
  }

  #searchInput {
    padding: 8px 10px;
    border: 1px solid #94a3b8;
    border-radius: 7px;
    outline: none;
    font: inherit;
  }

  #searchInput:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  #searchBox button {
    padding: 7px 11px;
    border: 1px solid #93c5fd;
    border-radius: 7px;
    background: #eff6ff;
    color: #1d4ed8;
    cursor: pointer;
    font: inherit;
    font-size: 0.86rem;
  }

  #searchBox button:hover:not(:disabled) {
    background: #dbeafe;
  }

  #searchBox button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #searchStatus {
    width: min(1100px, 100%);
    min-height: 20px;
    margin: 6px auto 0;
    color: #475569;
    font-size: 0.84rem;
  }

  .root-search-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #173b63;
    font-size: 0.84rem;
    font-weight: normal;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }

  .root-search-label input {
    margin: 0;
    cursor: pointer;
  }

  .derivatives-toggle-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #173b63;
    font-size: 0.84rem;
    font-weight: normal;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }

  .derivatives-toggle-label input {
    margin: 0;
    cursor: pointer;
  }

  /* Item جدید: بلوک «مشتقات یافت‌شده» - پیل‌های کوچک زیر ردیف کادر
     جست‌وجو، هم‌خانواده با index.htm/in-page-search.js. */
  .derivatives-status-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    width: min(1100px, 100%);
    margin: 0 auto;
  }

  .derivatives-status-row.has-content {
    margin-top: 8px;
  }

  .derivatives-inline {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .derivatives-inline.is-visible {
    display: flex;
  }

  .derivatives-inline-label {
    color: #334155;
    font-size: 0.72rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .derivatives-inline-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    font-size: 0.72rem;
    border: 1px solid #cbd5e1;
    border-radius: 9999px;
    background: #ffffff;
    color: #334155;
    cursor: pointer;
    user-select: none;
  }

  .derivatives-inline-item.is-active {
    background: #0f766e;
    border-color: #0f766e;
    color: #ffffff;
  }

  #resultsPanel {
    display: none;
    box-sizing: border-box;
    overflow-y: auto;
    background: #ffffff;
    direction: rtl;
    text-align: right;
    z-index: 400;
  }

  #resultsPanel.has-results {
    display: block;
  }

  #resultsPanel .results-header {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #173b63;
    font-size: 0.82rem;
    font-weight: bold;
  }

  #resultsPanel .results-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .results-copy-button {
    border: 1px solid #93c5fd;
    border-radius: 6px;
    background: #eff6ff;
    color: #1d4ed8;
    font: inherit;
    font-size: 0.74rem;
    padding: 4px 8px;
    cursor: pointer;
  }

  .results-copy-button:hover:not(:disabled) {
    background: #dbeafe;
  }

  .results-copy-button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #resultsPanel .results-close {
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
  }

  #resultsPanel .results-close:hover {
    color: #1d4ed8;
  }

  .result-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    padding: 9px 12px;
    border-bottom: 1px solid #eef2f7;
  }

  .result-item:last-child {
    border-bottom: none;
  }

  .result-checkbox {
    margin: 5px 0 0;
    flex-shrink: 0;
    cursor: pointer;
  }

  .result-jump {
    flex: 1;
    min-width: 0;
    padding: 0;
    border: none;
    background: transparent;
    color: #334155;
    font: inherit;
    font-size: 0.85rem;
    line-height: 1.9;
    text-align: right;
    direction: rtl;
    cursor: pointer;
  }

  .result-jump .result-page {
    display: block;
    color: #b45309;
    font-size: 0.72rem;
    font-weight: bold;
    margin-bottom: 2px;
  }

  .result-jump:hover {
    text-decoration: underline;
  }

  .result-item.active {
    background: #dbeafe;
    border-right: 3px solid #2563eb;
    padding-right: 9px;
  }

  .result-item mark {
    padding: 1px 2px;
    border-radius: 2px;
    background: #fde68a;
  }

  @media (min-width: 861px) {
    #resultsPanel {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      max-width: 90vw;
      bottom: 0;
      border-left: 1px solid #cbd5e1;
      box-shadow: 3px 0 10px rgba(15, 23, 42, 0.08);
    }
  }

  @media (max-width: 860px) {
    #resultsPanel {
      position: static;
      width: 100%;
      max-height: 320px;
      border-top: 1px solid #cbd5e1;
    }
  }

  /* Item 8 fix: #resultsPanel above is position:fixed on desktop and
     sits over the page, hiding the left edge of the PDF pages
     underneath it. Push the page content right by the panel's width
     while it's open so nothing is covered. */
  @media (min-width: 861px) {
    body.results-panel-open #pagesContainer {
      margin-left: 300px;
      transition: margin-left 0.15s ease;
    }
  }

  #voiceInputButton.is-listening {
    background: #fee2e2;
    border-color: #fca5a5;
    color: #b91c1c;
  }

  #pickerScreen {
    max-width: 560px;
    margin: 60px auto;
    padding: 28px;
    background: #fff;
    border: 1px solid #dbe3ee;
    border-radius: 16px;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    text-align: center;
  }

  #pickerScreen h2 {
    margin-top: 0;
    color: #173b63;
  }

  #pickerScreen p {
    color: #64748b;
    line-height: 1.9;
  }

  #fileInput {
    margin-top: 14px;
  }

  #pagesContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 20px 10px 60px;
  }

  .pdf-page-wrap {
    position: relative;
    background: #fff;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
  }

  .pdf-page-wrap canvas {
    display: block;
  }

  .pdf-text-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    line-height: 1;
  }

  .pdf-text-layer span {
    position: absolute;
    white-space: pre;
    transform-origin: 0% 0%;
    color: transparent;
    user-select: text;
    cursor: text;
  }

  .pdf-text-layer span::selection {
    background: rgba(37, 99, 235, 0.35);
    color: transparent;
  }

  mark.pdf-search-match {
    /* Semi-transparent on purpose: the text layer sits transparently on
       top of the canvas that already shows the real glyph pixels. An
       opaque highlight here would fully paint over that glyph and hide
       the letter. A translucent yellow lets the highlight read as a
       highlight while the actual letter underneath stays visible. */
    background: rgba(253, 230, 138, 0.55);
    color: transparent;
    opacity: 1;
  }

  mark.pdf-search-match.current-match {
    background: rgba(251, 191, 36, 0.55);
    outline: 2px solid #ea580c;
  }

  .page-number-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(23, 59, 99, 0.75);
    color: #fff;
    font-size: 0.72rem;
    z-index: 5;
  }

  #loadingNote {
    text-align: center;
    color: #64748b;
    padding: 30px;
  }

  #loadingNote .loading-progress-track {
    width: min(360px, 80vw);
    height: 8px;
    margin: 12px auto 0;
    border-radius: 999px;
    background: #dbe3ee;
    overflow: hidden;
  }

  #loadingNote .loading-progress-fill {
    height: 100%;
    width: 0%;
    background: #2563eb;

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const params = new URLSearchParams(location.search);
  const fileParam = params.get("file");
  const titleParam = params.get("title");

  const pickerScreen = document.getElementById("pickerScreen");
  const fileInput = document.getElementById("fileInput");
  const pagesContainer = document.getElementById("pagesContainer");
  const loadingNote = document.getElementById("loadingNote");
  const loadingNoteLabel = document.getElementById("loadingNoteLabel");
  const loadingProgressFill = document.getElementById("loadingProgressFill");
  const loadingProgressLabel = document.getElementById("loadingProgressLabel");
  const searchBox = document.getElementById("searchBox");
  const pdfTitleEl = document.getElementById("pdfTitle");
  const searchInput = document.getElementById("searchInput");
  const prevButton = document.getElementById("prevButton");
  const nextButton = document.getElementById("nextButton");
  const searchStatus = document.getElementById("searchStatus");
  const rootToggle = document.getElementById("rootToggle");
  const resultsPanel = document.getElementById("resultsPanel");
  const optionsToggle = document.getElementById("optionsToggle");
  const extraControls = document.getElementById("extraControls");

  // ---- Item جدید: تنظیمات مطالعه (حالت شب) - هم‌ارز in-page-search.js ---
  // با همون کلید و شکل داده در localStorage، تا ترجیح کاربر بین همهٔ
  // صفحات سایت (html و pdf) یکسان بماند.
  const READING_PREFS_KEY = "milaniReadingPrefs";
  const READING_ZOOM_STEP = 0.1;
  const READING_ZOOM_MIN = 0.7;
  const READING_ZOOM_MAX = 1.8;

  function loadReadingPrefs() {
    try {
      const parsed = JSON.parse(localStorage.getItem(READING_PREFS_KEY) || "{}");
      return {
        darkMode: !!parsed.darkMode,
        zoom: typeof parsed.zoom === "number" ? parsed.zoom : 1
      };
    } catch (error) {
      return { darkMode: false, zoom: 1 };
    }
  }

  function saveReadingPrefs(prefs) {
    try {
      localStorage.setItem(READING_PREFS_KEY, JSON.stringify(prefs));
    } catch (error) {
      // Storage unavailable or full - preference just won't persist.
    }
  }

  let readingPrefs = loadReadingPrefs();

  function applyReadingPrefs() {
    document.documentElement.classList.toggle("pdf-dark-mode", readingPrefs.darkMode);

    // Item جدید: زوم فقط روی خودِ صفحات PDF اعمال می‌شود (نه روی کادر
    // جستجو)، دقیقاً مثل wrapper اختصاصی in-page-search.js.
    pagesContainer.style.zoom = readingPrefs.zoom === 1 ? "" : readingPrefs.zoom;

    const darkButton = document.getElementById("darkModeToggle");

    if (darkButton) {
      darkButton.textContent = readingPrefs.darkMode ? "☀️" : "🌙";
      darkButton.title = readingPrefs.darkMode ? "حالت روز" : "حالت شب";
      darkButton.setAttribute("aria-label", darkButton.title);
    }

    const zoomLabel = document.getElementById("readingZoomLabel");

    if (zoomLabel) {
      zoomLabel.textContent = `${Math.round(readingPrefs.zoom * 100)}٪`;
    }
  }

  applyReadingPrefs();

  // ---- Item جدید: تاریخچهٔ جست‌وجوی اخیر - هم‌ارز in-page-search.js، با
  // همون کلید مشترک در localStorage. ----------------------------------
  const SEARCH_HISTORY_KEY = "milaniSearchHistoryRecent";
  const SEARCH_HISTORY_MAX = 5;

  function loadSearchHistory() {
    try {
      const parsed = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || "[]");
      return Array.isArray(parsed) ? parsed.filter(item => typeof item === "string") : [];
    } catch (error) {
      return [];
    }
  }

  function saveSearchHistory(list) {
    try {
      localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(list));
    } catch (error) {
      // Storage unavailable or full - history just won't persist.
    }
  }

  function pushSearchHistory(query) {
    const trimmed = (query || "").trim();

    if (!trimmed) {
      return;
    }

    const existing = loadSearchHistory().filter(item => item !== trimmed);
    existing.unshift(trimmed);

    saveSearchHistory(existing.slice(0, SEARCH_HISTORY_MAX));
  }

  let searchHistoryReflowHandler = null;
  let searchHistoryHoverCloseTimer = null;

  function cancelSearchHistoryHoverClose() {
    if (searchHistoryHoverCloseTimer) {
      clearTimeout(searchHistoryHoverCloseTimer);
      searchHistoryHoverCloseTimer = null;
    }
  }

  function scheduleSearchHistoryHoverClose() {
    cancelSearchHistoryHoverClose();

    searchHistoryHoverCloseTimer = setTimeout(() => {
      searchHistoryHoverCloseTimer = null;

      if (document.activeElement !== searchInput) {
        closeSearchHistoryDropdown();
      }
    }, 200);
  }

  function positionSearchHistoryDropdown() {
    const dropdown = document.getElementById("searchHistory");

    if (!dropdown || !dropdown.classList.contains("is-open")) {
      return;
    }

    const GAP = 4;
    const inputRect = searchInput.getBoundingClientRect();

    dropdown.style.left = inputRect.left + "px";
    dropdown.style.top = (inputRect.bottom + GAP) + "px";
    dropdown.style.width = inputRect.width + "px";
  }

  function renderSearchHistoryDropdown() {
    const dropdown = document.getElementById("searchHistory");

    if (!dropdown) {
      return;
    }

    const history = loadSearchHistory();

    if (history.length === 0) {
      dropdown.innerHTML = "";
      dropdown.classList.remove("is-open");
      return;
    }

    dropdown.innerHTML =
      `<div class="search-history-label">جست‌وجوهای اخیر</div>` +
      history.map(item =>
        `<button type="button" class="search-history-item">${escapeHtml(item)}</button>`
      ).join("");

    dropdown.querySelectorAll(".search-history-item").forEach(button => {
      button.addEventListener("mousedown", event => {
        event.preventDefault();

        searchInput.value = button.textContent;
        closeSearchHistoryDropdown();
        performSearch(button.textContent);
        pushSearchHistory(button.textContent);
        renderSearchHistoryDropdown();
      });
    });

    if (dropdown.classList.contains("is-open")) {
      positionSearchHistoryDropdown();
    }
  }

  function openSearchHistoryDropdown() {
    const dropdown = document.getElementById("searchHistory");

    if (!dropdown || searchInput.value.trim()) {
      return;
    }

    renderSearchHistoryDropdown();
    cancelSearchHistoryHoverClose();

    if (dropdown.innerHTML.trim()) {
      dropdown.classList.add("is-open");
      positionSearchHistoryDropdown();

      if (!searchHistoryReflowHandler) {
        searchHistoryReflowHandler = () => positionSearchHistoryDropdown();
        window.addEventListener("resize", searchHistoryReflowHandler);
        window.addEventListener("scroll", searchHistoryReflowHandler, true);
      }
    }
  }

  function closeSearchHistoryDropdown() {
    cancelSearchHistoryHoverClose();

    const dropdown = document.getElementById("searchHistory");

    if (dropdown) {
      dropdown.classList.remove("is-open");
    }

    if (searchHistoryReflowHandler) {
      window.removeEventListener("resize", searchHistoryReflowHandler);
      window.removeEventListener("scroll", searchHistoryReflowHandler, true);
      searchHistoryReflowHandler = null;
    }
  }

  const darkModeToggleButton = document.getElementById("darkModeToggle");

  if (darkModeToggleButton) {
    darkModeToggleButton.addEventListener("click", () => {
      readingPrefs.darkMode = !readingPrefs.darkMode;
      saveReadingPrefs(readingPrefs);
      applyReadingPrefs();
    });
  }


  let pdfDocument = null;
  let pageRecords = [];
  let matches = [];
  let currentMatch = -1;
  const selectedMatchIndexes = new Set();

  // documentIndex is a single, whole-document text index built once
  // after all pages are rendered (see buildDocumentIndex). Searching
  // against one continuous string - instead of one string per page -
  // is what lets a phrase that happens to be split across a page
  // boundary still be found; per-page indexing alone would miss it.
  let documentIndex = null;

  function normalize(text) {
    return (text || "")
      .toLowerCase()
      .replace(/[يى]/g, "ی")
      .replace(/ك/g, "ک")
      .replace(/ۀ/g, "ه")
      .replace(/ة/g, "ه")
      .replace(/[\u064B-\u0652\u0670\u0640]/g, "")
      .replace(/[\u200C\u200D]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function escapeRegExp(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  // ---- Root-based (stemming) search --------------------------------
  // Ported as-is from in-page-search.js (kept in sync manually) so
  // the same query resolves to the same root here as it does on the
  // HTML book pages. See that file for the full explanation of the
  // algorithm; this is the condensed version.
  const STEM_MIN_ROOT_LENGTH = 2;

  const STEM_PREFIXES = [
    "نمی", "می", "بی",
    "وال", "بال", "فال", "کال", "لل",
    "ال"
  ].sort((a, b) => b.length - a.length);

  const STEM_SUFFIXES = [
    "هایمان", "هایتان", "هایشان",
    "هایم", "هایت", "هایش",
    "ترین", "های", "گان",
    "یم", "ید", "ند", "تر",
    "ها", "ان", "ات", "ون", "ین", "یه",
    "ی", "ه"
  ].sort((a, b) => b.length - a.length);

  const AUGMENT_LETTERS = new Set(
    ["ا", "و", "ی", "ت", "ن", "م", "س", "ه"]
  );

  const WORD_PATTERN = /[\u0621-\u06FF]+(?:\u200c[\u0621-\u06FF]+)*/g;

  function cleanWord(word) {
    return normalize(word);
  }

  function reduceFourLetter(word) {
    const c0 = word[0];
    const c1 = word[1];
    const c2 = word[2];
    const c3 = word[3];

    if (c1 === "ا") return c0 + c2 + c3;
    if (c2 === "ا") return c0 + c1 + c3;
    if (c2 === "و") return c0 + c1 + c3;
    if (c2 === "ی") return c0 + c1 + c3;
    if (c0 === "م") return c1 + c2 + c3;
    if (c0 === "ت") return c1 + c2 + c3;

    return null;
  }

  function reduceFiveLetter(word) {
    const c0 = word[0];
    const c1 = word[1];
    const c2 = word[2];
    const c3 = word[3];
    const c4 = word[4];

    if (c1 === "و" && c2 === "ا") return c0 + c3 + c4;
    if (c0 === "م" && c2 === "ا") return c1 + c3 + c4;
    if (c0 === "م" && c3 === "و") return c1 + c2 + c4;
    if (c0 === "ت" && c3 === "ی") return c1 + c2 + c4;
    if (c1 === "ت" && c3 === "ا") return c0 + c2 + c4;
    if (c2 === "ا" && c3 === "ی") return c0 + c1 + c4;

    return null;
  }

  function reduceLongWord(word) {
    const first = word[0];

    if (AUGMENT_LETTERS.has(first) && word.length - 1 >= 4) {
      return word.slice(1);
    }

    const last = word[word.length - 1];

    if (AUGMENT_LETTERS.has(last) && word.length - 1 >= 4) {
      return word.slice(0, -1);
    }

    return null;
  }

  function deaugmentToRoot(word) {
    let w = word;
    let guard = 0;

    while (w.length > 3 && guard < 4) {
      guard += 1;

      let reduced = null;

      if (w.length === 4) {
        reduced = reduceFourLetter(w);
      } else if (w.length === 5) {
        reduced = reduceFiveLetter(w);
      } else if (w.length >= 6) {
        reduced = reduceLongWord(w);
      }

      if (reduced === null || reduced.length >= w.length) {
        break;
      }

      w = reduced;
    }

    return w;
  }

  function stripOnePrefix(word) {
    for (const prefix of STEM_PREFIXES) {
      if (
        word.startsWith(prefix) &&
        word.length - prefix.length >= STEM_MIN_ROOT_LENGTH
      ) {
        return word.slice(prefix.length);
      }
    }

    return word;
  }

  function stripSuffixes(word) {
    let result = word;

    for (let pass = 0; pass < 2; pass++) {
      for (const suffix of STEM_SUFFIXES) {
        if (
          result.endsWith(suffix) &&
          result.length - suffix.length >= STEM_MIN_ROOT_LENGTH
        ) {
          result = result.slice(0, -suffix.length);
          break;
        }
      }
    }

    return result;
  }

  function stemWord(word) {
    let w = stripOnePrefix(cleanWord(word));

    if (w.length > 3) {
      const patternResult = deaugmentToRoot(w);

      if (patternResult.length === 3) {
        return patternResult;
      }

      w = patternResult;
    }

    w = stripSuffixes(w);

    if (w.length > 3) {
      w = deaugmentToRoot(w);
    }

    return w;
  }

  function getQueryStems(query) {
    return query
      .trim()
      .split(/\s+/)
      .filter(Boolean)
      .map(stemWord)
      .filter(Boolean);
  }

  // ---- Item 4: بلوک «مشتقات یافت‌شده» -----------------------------------
  const VISUAL_DIACRITICS = /[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g;
  const VISUAL_INVISIBLE = /[\u200C-\u200F]/g;

  function getVisualWordKey(word) {
    return (word || "")
      .replace(VISUAL_DIACRITICS, "")
      .replace(VISUAL_INVISIBLE, "")
      .replace(/[يى]/g, "ی")
      .replace(/ك/g, "ک")
      .replace(/[ۀة]/g, "ه")
      .replace(/[أإآ]/g, "ا")
      .replace(/ؤ/g, "و")
      .replace(/ئ/g, "ی")
      .toLowerCase()
      .trim();
  }

  function getVisualWordLabel(word) {
    return (word || "")
      .replace(VISUAL_DIACRITICS, "")
      .replace(VISUAL_INVISIBLE, "")
      .trim();
  }

  // rootBaseResults: همهٔ نتایج جست‌وجوی ریشه‌ای، بدون فیلتر مشتق - تا
  // با انتخاب/لغو یک تراشه بشود دوباره فیلتر کرد بدون جست‌وجوی مجدد.
  let rootBaseResults = [];
  const activeDerivativeKeys = new Set();

  function isDerivativesViewEnabled() {
    const toggle = document.getElementById("showDerivatives");
    return !!(toggle && toggle.checked);
  }

  function updateShowDerivativesVisibility() {
    const label = document.getElementById("showDerivativesLabel");
    if (!label) return;
    label.style.display = (rootToggle && rootToggle.checked) ? "inline-flex" : "none";
  }

  function renderDerivativesBlock() {
    const block = document.getElementById("derivativesBlock");
    const row = document.querySelector(".derivatives-status-row");

    if (!block) return;

    if (!isRootSearchEnabled() || !isDerivativesViewEnabled() || rootBaseResults.length === 0) {
      block.innerHTML = "";
      block.classList.remove("is-visible");
      if (row) row.classList.remove("has-content");
      return;
    }

    const derivativeCounts = new Map();
    const derivativeLabels = new Map();

    rootBaseResults.forEach(m => {
      (m.matchedWords || []).forEach(word => {
        const key = getVisualWordKey(word);
        if (!key) return;

        derivativeCounts.set(key, (derivativeCounts.get(key) || 0) + 1);

        if (!derivativeLabels.has(key)) {
          derivativeLabels.set(key, getVisualWordLabel(word));
        }
      });
    });

    const derivatives = [...derivativeCounts.keys()].sort((a, b) => a.localeCompare(b, "fa"));

    if (derivatives.length === 0) {
      block.innerHTML = "";
      block.classList.remove("is-visible");
      if (row) row.classList.remove("has-content");
      return;
    }

    const allChipClass = activeDerivativeKeys.size === 0 ?
      "derivatives-inline-item is-active" : "derivatives-inline-item";

    const chips = derivatives.map(key => {
      const chipClass = activeDerivativeKeys.has(key) ?
        "derivatives-inline-item is-active" : "derivatives-inline-item";
      const label = derivativeLabels.get(key) || key;

      return (
        `<span class="${chipClass}" data-derivative="${escapeHtml(key)}" role="button" tabindex="0">` +
          `${escapeHtml(label)} <span class="deriv-count">(${derivativeCounts.get(key)})</span>` +
        `</span>`
      );
    }).join("");

    block.innerHTML =
      `<span class="derivatives-inline-label">مشتقات یافت‌شده (${derivatives.length}):</span>` +
      `<span class="${allChipClass}" data-derivative="" role="button" tabindex="0">همهٔ مشتقات</span>` +
      chips;

    block.classList.add("is-visible");
    if (row) row.classList.add("has-content");

    block.querySelectorAll("[data-derivative]").forEach(el => {
      const toggle = () => {
        const key = el.dataset.derivative;
        toggleDerivative(key || null);
      };

      el.addEventListener("click", toggle);
      el.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggle();
        }
      });
    });
  }

  function toggleDerivative(key) {
    if (!key) {
      activeDerivativeKeys.clear();
    } else if (activeDerivativeKeys.has(key)) {
      activeDerivativeKeys.delete(key);
    } else {
      activeDerivativeKeys.add(key);
    }

    matches = activeDerivativeKeys.size === 0 ?
      rootBaseResults.slice() :
      rootBaseResults.filter(m =>
        (m.matchedWordKeys || []).some(k => activeDerivativeKeys.has(k))
      );

    matches = sortMatchesForDisplay(matches);
    currentMatch = -1;
    selectedMatchIndexes.clear();

    renderDerivativesBlock();
    renderResultsPanel();

    if (matches.length > 0) {
      showMatch(0);
    } else {
      updateStatus();
    }

    updateButtons();
  }

  const flexibleCharClasses = {
    "ي": "[يىی]", "ى": "[يىی]", "ی": "[يىی]",
    "ك": "[كک]", "ک": "[كک]",
    "ة": "[ةهۀ]", "ه": "[ةهۀ]", "ۀ": "[ةهۀ]"
  };

  // Same whole-word boundary as in-page-search.js: without it,
  // searching "وجود" would also highlight the "وجود" inside
  // "موجودات". JS \b doesn't recognize Arabic/Persian letters, so
  // this uses an explicit lookaround against the Arabic Unicode
  // letter block instead.
  const WORD_BOUNDARY_CHARS = "\\u0621-\\u06FF\\u200c";

  function buildFlexiblePattern(query) {
    const collapsed = query.trim().replace(/\s+/g, " ");
    if (!collapsed) return "";

    const gap = "[\\u064B-\\u0652\\u0670\\u0640\\u200C\\u200D]*";
    let pattern = "";

    for (const char of collapsed) {
      if (char === " ") {
        pattern += "\\s+" + gap;
      } else {
        pattern += (flexibleCharClasses[char] || escapeRegExp(char)) + gap;
      }
    }

    return (
      `(?<![${WORD_BOUNDARY_CHARS}])` +
      pattern +
      `(?![${WORD_BOUNDARY_CHARS}])`
    );
  }

  async function loadPdf(source) {
    pickerScreen.style.display = "none";
    loadingNote.style.display = "block";
    loadingNoteLabel.textContent = "در حال بارگذاری PDF…";
    loadingProgressFill.style.width = "0%";
    loadingProgressLabel.textContent = "";

    // disableFontFace: true forces pdf.js to draw each letter itself from
    // the embedded font's own outlines (exactly as the PDF specifies),
    // instead of handing the Unicode text to the browser's own font/text
    // -shaping engine via @font-face + fillText(). Many embedded, subsetted
    // Arabic/Persian fonts lose their glyph-joining tables during subsetting,
    // so a browser that tries to re-shape them itself ends up drawing
    // disconnected, isolated letterforms — which is exactly the "به‌هم‌ریخته"
    // look in your screenshot. Rendering the outlines directly sidesteps
    // the host browser's shaping engine entirely, so it's consistent
    // everywhere.
    const loadingTask = typeof source === "string"
      ? pdfjsLib.getDocument({ url: source, disableFontFace: true })
      : pdfjsLib.getDocument({ data: source, disableFontFace: true });

    pdfDocument = await loadingTask.promise;

    let displayTitle = titleParam;

    if (!displayTitle) {
      try {
        const metadata = await pdfDocument.getMetadata();
        displayTitle = (metadata.info && metadata.info.Title) || "";
      } catch (error) {
        displayTitle = "";
      }
    }

    document.title = displayTitle || "نمایشگر PDF";
    pdfTitleEl.textContent = displayTitle || "";
    searchBox.style.display = displayTitle ? "block" : "none";
    if (!displayTitle) {
      pdfTitleEl.style.display = "none";
    }

    await renderAllPages();
    buildDocumentIndex();

    loadingNote.style.display = "none";
    searchBox.style.display = "block";

    reserveScrollOffsetForStickyBox();
    applyIncomingQueryFromUrl();
    applyIncomingPageHash();
  }

  async function renderAllPages() {
    const scale = 1.4;
    const totalPages = pdfDocument.numPages;
    pageRecords = [];

    loadingNoteLabel.textContent = "در حال رندر صفحات…";

    for (let pageNumber = 1; pageNumber <= totalPages; pageNumber++) {
      const page = await pdfDocument.getPage(pageNumber);
      const viewport = page.getViewport({ scale });

      const wrap = document.createElement("div");
      wrap.className = "pdf-page-wrap";
      wrap.style.width = viewport.width + "px";
      wrap.style.height = viewport.height + "px";
      // renderTextLayer needs this variable to size/position spans correctly.
      wrap.style.setProperty("--scale-factor", viewport.scale);

      const badge = document.createElement("span");
      badge.className = "page-number-badge";
      badge.textContent = "صفحهٔ " + pageNumber;
      wrap.appendChild(badge);

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      wrap.appendChild(canvas);

      const textLayerDiv = document.createElement("div");
      textLayerDiv.className = "pdf-text-layer";
      textLayerDiv.style.width = viewport.width + "px";
      textLayerDiv.style.height = viewport.height + "px";
      wrap.appendChild(textLayerDiv);

      pagesContainer.appendChild(wrap);

      await page.render({
        canvasContext: canvas.getContext("2d"),
        viewport: viewport
      }).promise;

      const textContent = await page.getTextContent();

      // Use pdf.js's own text-layer builder instead of hand-rolled geometry.
      // This is the exact same engine Firefox's built-in PDF reader relies
      // on for correct RTL reading order *and* reliable copy/paste, so we
      // stop guessing line grouping / left-to-right vs right-to-left order
      // ourselves — pdf.js already gets this right.
      const renderTask = pdfjsLib.renderTextLayer({
        textContentSource: textContent,
        container: textLayerDiv,
        viewport: viewport
      });

      await renderTask.promise;

      // Build the searchable/copyable text straight from the DOM that was
      // actually produced, walking it in document order. This guarantees
      // our search index always matches what a real text selection (and
      // therefore what gets copied) will contain — no separate, possibly
      // out-of-sync reconstruction of the text.
      const spans = [];

      Array.from(textLayerDiv.childNodes).forEach(node => {
        if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "SPAN") {
          spans.push({ el: node, text: node.textContent, hasEOL: false });
        } else if (node.tagName === "BR") {
          spans.push({ el: null, text: " ", hasEOL: false });
        }
      });

      pageRecords.push({ pageNumber, wrap, textLayerDiv, spans });

      const percent = Math.round((pageNumber / totalPages) * 100);
      loadingProgressFill.style.width = percent + "%";
      loadingProgressLabel.textContent =
        `صفحهٔ ${pageNumber} از ${totalPages} (${percent}٪)`;

      // Yield to the browser after each page so the progress bar and the
      // page just rendered actually paint on screen, instead of the whole
      // 500-page loop running as one uninterrupted block that only shows
      // its result at the very end.
      await new Promise(resolve => setTimeout(resolve, 0));
    }

    loadingNoteLabel.textContent = "در حال آماده‌سازی نمایهٔ جست‌وجو…";
  }

  function buildPageIndex(spans) {
    let text = "";
    const map = [];

    spans.forEach(span => {
      const str = span.text;

      for (let i = 0; i < str.length; i++) {
        map.push({ span: span, offset: i });
      }

      text += str;
    });

    return { text, map };
  }

  function clearHighlights() {
    pageRecords.forEach(record => {
      record.spans.forEach(span => {
        if (!span.el) return;
        span.el.innerHTML = "";
        span.el.textContent = span.text;
      });
    });

    matches = [];
    currentMatch = -1;
    selectedMatchIndexes.clear();
  }

  function highlightRangeOnSpans(map, start, end) {
    const marks = [];
    let i = start;

    while (i < end) {
      const entry = map[i];

      if (!entry || !entry.span || !entry.span.el) {
        i++;
        continue;
      }

      const span = entry.span;
      let j = i;
      const spanStartOffset = entry.offset;

      while (
        j < end &&
        map[j] &&
        map[j].span === span
      ) {
        j++;
      }

      const spanEndOffset = map[j - 1].offset + 1;
      const fullText = span.text;

      const before = fullText.slice(0, spanStartOffset);
      const middle = fullText.slice(spanStartOffset, spanEndOffset);
      const after = fullText.slice(spanEndOffset);

      span.el.textContent = "";

      if (before) {
        span.el.appendChild(document.createTextNode(before));
      }

      const mark = document.createElement("mark");
      mark.className = "pdf-search-match";
      mark.textContent = middle;
      span.el.appendChild(mark);
      marks.push(mark);

      if (after) {
        span.el.appendChild(document.createTextNode(after));
      }

      i = j;
    }

    return marks;
  }

  // Build one continuous index across every page instead of one
  // index per page. This is what lets a phrase that straddles a
  // page break still be found - a single space joins each page's
  // text to the next, so words never fuse together across the
  // boundary but the regex/stem scan still runs over the whole
  // document in one pass.
  function buildDocumentIndex() {
    let fullText = "";
    const fullMap = [];

    pageRecords.forEach((record, recordIndex) => {
      if (recordIndex > 0) {
        fullMap.push({ span: null, record: null, offset: -1 });
        fullText += " ";
      }

      const { text, map } = buildPageIndex(record.spans);

      map.forEach(entry => {
        fullMap.push({ span: entry.span, record: record, offset: entry.offset });
      });

      fullText += text;
    });

    documentIndex = { text: fullText, map: fullMap };
  }

  function isRootSearchEnabled() {
    return !!(rootToggle && rootToggle.checked);
  }

  function getPageNumberForRange(map, start, end) {
    for (let i = start; i < end; i++) {
      if (map[i] && map[i].record) {
        return map[i].record.pageNumber;
      }
    }

    return null;
  }

  // ---- Snippets (Word-style "find" side list) -----------------------

  const SNIPPET_SENTENCE_ENDERS = /[.!?؟۔،؛:\u064B-\u0652]/;
  const SNIPPET_MAX_LENGTH = 420;
  const SNIPPET_MIN_CONTEXT = 140;

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function getSnippetBounds(text, startOffset, endOffset) {
    let sentenceStart = startOffset;

    while (
      sentenceStart > 0 &&
      !SNIPPET_SENTENCE_ENDERS.test(text[sentenceStart - 1])
    ) {
      sentenceStart--;
    }

    let sentenceEnd = endOffset;

    while (
      sentenceEnd < text.length &&
      !SNIPPET_SENTENCE_ENDERS.test(text[sentenceEnd - 1])
    ) {
      sentenceEnd++;
    }

    sentenceStart = Math.max(0, Math.min(sentenceStart, startOffset - SNIPPET_MIN_CONTEXT));
    sentenceEnd = Math.min(text.length, Math.max(sentenceEnd, endOffset + SNIPPET_MIN_CONTEXT));

    if (sentenceEnd - sentenceStart > SNIPPET_MAX_LENGTH) {
      const half = Math.floor(SNIPPET_MAX_LENGTH / 2);

      sentenceStart = Math.max(sentenceStart, startOffset - half);
      sentenceEnd = Math.min(sentenceEnd, endOffset + half);
    }

    return { sentenceStart, sentenceEnd };
  }

  function buildSnippetHtml(text, startOffset, endOffset) {
    const { sentenceStart, sentenceEnd } = getSnippetBounds(text, startOffset, endOffset);

    const before = text.slice(sentenceStart, startOffset).replace(/\s+/g, " ").trim();
    const matchedText = text.slice(startOffset, endOffset);
    const after = text.slice(endOffset, sentenceEnd).replace(/\s+/g, " ").trim();

    const prefix = sentenceStart > 0 ? "…" : "";
    const suffix = sentenceEnd < text.length ? "…" : "";

    return (
      `${prefix}${escapeHtml(before)} ` +
      `<mark>${escapeHtml(matchedText)}</mark> ` +
      `${escapeHtml(after)}${suffix}`
    ).replace(/\s+/g, " ").trim();
  }

  function getSnippetPlainText(text, startOffset, endOffset) {
    const { sentenceStart, sentenceEnd } = getSnippetBounds(text, startOffset, endOffset);

    const prefix = sentenceStart > 0 ? "…" : "";
    const suffix = sentenceEnd < text.length ? "…" : "";

    return (
      prefix +
      text.slice(sentenceStart, sentenceEnd).replace(/\s+/g, " ").trim() +
      suffix
    );
  }

  async function copyTextToClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (error) {
      // fall through to the legacy fallback below
    }

    try {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      const successful = document.execCommand("copy");
      document.body.removeChild(textarea);

      return successful;
    } catch (error) {
      return false;
    }
  }

  // Item جدید: هم متن ساده هم HTML را هم‌زمان در کلیپ‌بورد می‌گذارد - هم‌ارز
  // copyRichTextToClipboard در in-page-search.js.
  async function copyRichTextToClipboard(text, html) {
    try {
      if (
        navigator.clipboard &&
        window.isSecureContext &&
        typeof ClipboardItem !== "undefined" &&
        navigator.clipboard.write
      ) {
        await navigator.clipboard.write([
          new ClipboardItem({
            "text/plain": new Blob([text], { type: "text/plain" }),
            "text/html": new Blob([html], { type: "text/html" })
          })
        ]);
        return true;
      }
    } catch (error) {
      // fall through to the plain-text-only fallback below
    }

    return copyTextToClipboard(text);
  }

  // ---- Voice assistant (item 1) ---------------------------------------
  let voiceRecognition = null;

  function getSpeechRecognitionCtor() {
    return window.SpeechRecognition || window.webkitSpeechRecognition || null;
  }

  function speakText(text) {
    if (!("speechSynthesis" in window) || !text) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "fa-IR";
    window.speechSynthesis.speak(utterance);
  }

  function toggleVoiceInput() {
    const Ctor = getSpeechRecognitionCtor();
    const button = document.getElementById("voiceInputButton");

    if (!Ctor) {
      if (button) {
        button.title = "پشتیبانی نمی‌شود";
        button.setAttribute("aria-label", "جست‌وجوی صوتی - پشتیبانی نمی‌شود");
      }
      return;
    }

    if (voiceRecognition) {
      voiceRecognition.stop();
      return;
    }

    voiceRecognition = new Ctor();
    voiceRecognition.lang = "fa-IR";
    voiceRecognition.interimResults = false;
    voiceRecognition.maxAlternatives = 1;

    voiceRecognition.addEventListener("start", () => {
      if (button) {
        button.classList.add("is-listening");
        button.title = "در حال شنیدن…";
        button.setAttribute("aria-label", "در حال شنیدن…");
      }
    });

    voiceRecognition.addEventListener("result", event => {
      const transcript = event.results[0][0].transcript;
      searchInput.value = transcript;
      performSearch(transcript);
      pushSearchHistory(transcript);
      closeSearchHistoryDropdown();
    });

    voiceRecognition.addEventListener("end", () => {
      if (button) {
        button.classList.remove("is-listening");
        button.title = "جست‌وجوی صوتی";
        button.setAttribute("aria-label", "جست‌وجوی صوتی");
      }
      voiceRecognition = null;
    });

    voiceRecognition.start();
  }

  // Item 3 support: jump straight to a page when the viewer is
  // opened with a #page=N hash (as produced by buildMatchUrl above).
  function applyIncomingPageHash() {
    const match = /(?:^|[#&])page=(\d+)/.exec(location.hash);
    if (!match) return;

    const record = pageRecords[parseInt(match[1], 10) - 1];
    if (record) {
      setTimeout(() => {
        record.wrap.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 60);
    }
  }

  function reserveScrollOffsetForStickyBox() {
    const boxHeight = searchBox.offsetHeight;
    let totalHeight = boxHeight;

    resultsPanel.style.top = boxHeight + "px";

    if (
      resultsPanel.classList.contains("has-results") &&
      getComputedStyle(resultsPanel).position !== "fixed"
    ) {
      totalHeight += resultsPanel.offsetHeight;
    }

    document.documentElement.style.setProperty(
      "scroll-padding-top",
      totalHeight + "px"
    );
  }

  function renderResultsPanel() {
    if (matches.length === 0) {
      resultsPanel.innerHTML = "";
      resultsPanel.classList.remove("has-results");
      document.body.classList.remove("results-panel-open");
      selectedMatchIndexes.clear();
      reserveScrollOffsetForStickyBox();
      return;
    }

    const items = matches
      .map((m, index) => {
        const activeClass = index === currentMatch ? " active" : "";
        const checkedAttr = selectedMatchIndexes.has(index) ? "checked" : "";
        const pageLabel = m.pageNumber ?
          `<span class="result-page">صفحهٔ ${m.pageNumber}</span>` : "";

        return (
          `<div class="result-item${activeClass}" data-index="${index}">` +
            `<input type="checkbox" class="result-checkbox" data-index="${index}" ${checkedAttr} aria-label="انتخاب این نتیجه">` +
            `<button type="button" class="result-jump" data-index="${index}">` +
              pageLabel + m.snippetHtml +
            `</button>` +
          `</div>`
        );
      })
      .join("");

    resultsPanel.innerHTML = `
      <div class="results-header">
        <span>${matches.length} نتیجه</span>
        <div class="results-actions">
          <button type="button" id="speakResultsButton" class="results-copy-button" title="خواندن نتایج با صدا">
            🔊 خواندن
          </button>
          <button type="button" class="results-close" aria-label="بستن فهرست نتایج">×</button>
        </div>
      </div>
      ${items}
    `;

    resultsPanel.classList.add("has-results");
    document.body.classList.add("results-panel-open");

    resultsPanel.querySelectorAll(".result-jump").forEach(button => {
      button.addEventListener("click", () => {
        showMatch(parseInt(button.dataset.index, 10));
      });
    });

    resultsPanel.querySelectorAll(".result-checkbox").forEach(checkbox => {
      checkbox.addEventListener("change", () => {
        const index = parseInt(checkbox.dataset.index, 10);

        if (checkbox.checked) {
          selectedMatchIndexes.add(index);
        } else {
          selectedMatchIndexes.delete(index);
        }

        updateCopySelectedButton();
      });
    });

    const closeButton = resultsPanel.querySelector(".results-close");

    if (closeButton) {
      closeButton.addEventListener("click", () => {
        resultsPanel.classList.remove("has-results");
        document.body.classList.remove("results-panel-open");
        reserveScrollOffsetForStickyBox();
      });
    }

    const speakButton = resultsPanel.querySelector("#speakResultsButton");

    if (speakButton) {
      speakButton.addEventListener("click", () => {
        const textToRead = matches.map(m => m.snippetPlainText).join(". ");
        speakText(textToRead);
      });
    }

    updateCopySelectedButton();
    reserveScrollOffsetForStickyBox();
  }

  // Item جدید: دکمهٔ مستقل «کپی انتخاب‌شده‌ها» به منوی تنظیمات (⚙️)
  // منتقل شد - این تابع فقط منو را (اگر باز باشد) به‌روزرسانی می‌کند تا
  // نشان تعداد/فعال‌بودنش هماهنگ بماند - هم‌ارز الگوی in-page-search.js.
  function updateCopySelectedButton() {
    renderSettingsMenu();
  }

  // Item 3: a link back to a specific match - points at this same
  // viewer URL with a #page=N hash, which applyIncomingPageHash()
  // (below) scrolls to on load.
  function buildMatchUrl(match) {
    const base = location.origin + location.pathname + location.search;
    return match && match.pageNumber ?
      `${base}#page=${match.pageNumber}` :
      base;
  }

  async function handleCopySelectedMatches() {
    const button = document.getElementById("menuCopySelected");
    const selected = getSelectedMatchesInOrder();

    if (selected.length === 0) return;

    const title = pdfTitleEl.textContent || document.title;
    const divider = "─".repeat(32);

    // Item 8: از پاراگراف کامل (تا ۱۵۰۰ کاراکتر، با عبارت پیداشده
    // پررنگ) استفاده می‌شود، نه فقط تکهٔ کوتاهی که در فهرست نتایج
    // نشان داده شده.
    const plainText = selected
      .map(m => {
        const pageSuffix = m.pageNumber ? ` (صفحهٔ ${m.pageNumber})` : "";

        return (
          `📘 عنوان: ${title}${pageSuffix}\n${divider}\n` +
          `«${buildExcerptPlainText(buildMatchExcerpt(m))}»\n` +
          `🔗 ${formatShareLink("لینک منبع", buildMatchUrl(m))}`
        );
      })
      .join("\n\n");

    const html = selected
      .map(m => {
        const pageSuffix = m.pageNumber ? ` (صفحهٔ ${m.pageNumber})` : "";
        const snippetHtml = buildExcerptHtml(buildMatchExcerpt(m));
        const url = escapeHtml(buildMatchUrl(m));

        return (
          `<div dir="ltr" style="margin:0 0 16px;text-align:right;">` +
            `<table dir="ltr" role="presentation" style="width:100%;border-collapse:collapse;` +
            `margin:0 0 8px;"><tr><td style="padding:9px 14px;background:#eff6ff;` +
            `border-right:4px solid #2563eb;font-family:Tahoma,Arial,sans-serif;` +
            `font-size:14px;font-weight:bold;color:#173b63;text-align:right;">` +
            `📘\u00a0${escapeHtml(title)}${pageSuffix}</td></tr></table>` +
            `<p dir="ltr" style="margin:0 0 4px;font-family:Tahoma,Arial,sans-serif;` +
            `font-size:14px;line-height:1.9;color:#1f2937;text-align:right;">«${snippetHtml}»</p>` +
            `<p dir="ltr" style="margin:0;font-family:Tahoma,Arial,sans-serif;font-size:12px;text-align:right;">` +
            `🔗 <a href="${url}" style="color:#1d4ed8;text-decoration:none;">لینک منبع</a></p>` +
          `</div>`
        );
      })
      .join("");

    const ok = await copyRichTextToClipboard(plainText, html);

    if (button) {
      button.innerHTML = `<span>${ok ? "کپی شد!" : "خطا در کپی"}</span>`;
      setTimeout(updateCopySelectedButton, 1500);
    }
  }

  function updateResultsPanelActiveState() {
    resultsPanel.querySelectorAll(".result-item").forEach((item, index) => {
      item.classList.toggle("active", index === currentMatch);
    });

    const activeItem = resultsPanel.querySelector(".result-item.active");

    if (activeItem) {
      activeItem.scrollIntoView({ block: "nearest", behavior: "auto" });
    }
  }

  // Item جدید (رفع اشکال بحرانی): این تابع دقیقاً همون رفع‌اشکالی است که
  // برای همین باگ در in-page-search.js جواب داد. scrollIntoView این‌جا
  // (روی صفحه‌ای که ممکن است صدها صفحهٔ PDF پشت‌سرهم رندر شده باشد، و
  // یک ناحیهٔ قابل‌اسکرول جداگانه - #resultsPanel - هم کنارش هست)
  // ظاهراً محاسبهٔ موقعیتش قابل‌اعتماد نیست. window.scrollTo با مختصات
  // محاسبه‌شدهٔ دستی، این ابهام را کاملاً کنار می‌گذارد.
  function scrollWindowToElement(element) {
    const rect = element.getBoundingClientRect();
    const targetY = window.scrollY + rect.top - (window.innerHeight / 2) + (rect.height / 2);

    window.scrollTo({
      top: Math.max(0, targetY),
      behavior: "auto"
    });
  }

  // ---- Core search/navigate -----------------------------------------

  // ---- Item جدید: انتخاب همه/حذف انتخاب/حذف موارد انتخاب‌شده ----------
  function getSelectedMatchesInOrder() {
    return [...selectedMatchIndexes]
      .sort((a, b) => a - b)
      .map(index => matches[index])
      .filter(Boolean);
  }

  function selectAllVisibleMatches() {
    matches.forEach((_, index) => selectedMatchIndexes.add(index));
    resultsPanel.querySelectorAll(".result-checkbox").forEach(checkbox => {
      checkbox.checked = true;
    });
    updateCopySelectedButton();
  }

  function clearMatchSelection() {
    selectedMatchIndexes.clear();
    resultsPanel.querySelectorAll(".result-checkbox").forEach(checkbox => {
      checkbox.checked = false;
    });
    updateCopySelectedButton();
  }

  function removeSelectedMatches() {
    const selectedSet = new Set(selectedMatchIndexes);

    if (selectedSet.size === 0) {
      return;
    }

    matches = matches.filter((_, index) => !selectedSet.has(index));
    selectedMatchIndexes.clear();
    currentMatch = -1;
    renderResultsPanel();
    updateButtons();
    updateStatus();
  }

  // ---- Item ب: مرتب‌سازی نتایج (محل وقوع / پرتکرارترین) ----------------
  let resultsSortMode = "position";

  function getMatchesFrequencyCounts(list) {
    const counts = new Map();

    list.forEach(m => {
      if (!m.sortKey) return;
      counts.set(m.sortKey, (counts.get(m.sortKey) || 0) + 1);
    });

    return counts;
  }

  function sortMatchesForDisplay(list) {
    if (resultsSortMode !== "frequency") {
      return list.slice();
    }

    const counts = getMatchesFrequencyCounts(list);

    return list
      .map((m, index) => ({ m, index }))
      .sort((a, b) => {
        const freqA = counts.get(a.m.sortKey) || 0;
        const freqB = counts.get(b.m.sortKey) || 0;

        if (freqB !== freqA) return freqB - freqA;
        return a.index - b.index;
      })
      .map(item => item.m);
  }

  // ---- Item ز: جست‌وجوی مجاورتی ----------------------------------------
  let proximitySearchEnabled = false;
  let proximityDistance = 5;

  function getProximityQueryWords(query) {
    return [...new Set(
      query.trim().split(/\s+/).filter(Boolean).map(normalize).filter(Boolean)
    )];
  }

  function findProximityRanges(text, queryWords, maxDistance) {
    const ranges = [];

    if (queryWords.length < 2) {
      if (queryWords.length === 1) {
        const patternSource = buildFlexiblePattern(queryWords[0]);

        if (patternSource) {
          const pattern = new RegExp(patternSource, "gi");
          let match;

          while ((match = pattern.exec(text)) !== null) {
            if (match[0].length === 0) {
              pattern.lastIndex++;
              continue;
            }

            ranges.push({ start: match.index, end: match.index + match[0].length });
          }
        }
      }

      return ranges;
    }

    WORD_PATTERN.lastIndex = 0;
    const tokens = [];
    let wordMatch;

    while ((wordMatch = WORD_PATTERN.exec(text)) !== null) {
      tokens.push({
        normalized: normalize(wordMatch[0]),
        start: wordMatch.index,
        end: wordMatch.index + wordMatch[0].length
      });
    }

    for (let i = 0; i < tokens.length; i++) {
      const remaining = new Set(queryWords);
      let lastIndex = -1;

      for (
        let j = i;
        j < tokens.length && j - i <= maxDistance + queryWords.length - 1;
        j++
      ) {
        if (remaining.has(tokens[j].normalized)) {
          remaining.delete(tokens[j].normalized);
          lastIndex = j;
        }

        if (remaining.size === 0) break;
      }

      if (remaining.size === 0) {
        const wordsBetween = lastIndex - i - (queryWords.length - 1);

        if (wordsBetween <= maxDistance) {
          ranges.push({ start: tokens[i].start, end: tokens[lastIndex].end });
        }
      }
    }

    return ranges;
  }

  // ---- Item 8: پاراگراف کامل برای کپی/خروجی ----------------------------
  const EXCERPT_MAX_LENGTH = 1500;

  function buildMatchExcerpt(match) {
    const rawText = documentIndex.text;
    const start = match.start;
    const end = match.end;

    let sliceStart = 0;
    let sliceEnd = rawText.length;

    if (rawText.length > EXCERPT_MAX_LENGTH) {
      const spanLength = end - start;
      const padding = Math.max(0, Math.floor((EXCERPT_MAX_LENGTH - spanLength) / 2));

      sliceStart = Math.max(0, start - padding);
      sliceEnd = Math.min(rawText.length, end + padding);
    }

    return {
      rawText,
      sliceStart,
      sliceEnd,
      spanStart: start,
      spanEnd: end,
      truncatedBefore: sliceStart > 0,
      truncatedAfter: sliceEnd < rawText.length
    };
  }

  function buildExcerptPlainText(excerpt) {
    const { rawText, sliceStart, sliceEnd, spanStart, spanEnd, truncatedBefore, truncatedAfter } = excerpt;

    let body;

    if (spanStart === -1 || spanEnd <= sliceStart || spanStart >= sliceEnd) {
      body = rawText.slice(sliceStart, sliceEnd);
    } else {
      const s = Math.max(spanStart, sliceStart);
      const e = Math.min(spanEnd, sliceEnd);
      body = rawText.slice(sliceStart, s) + `**${rawText.slice(s, e)}**` + rawText.slice(e, sliceEnd);
    }

    const prefix = truncatedBefore ? "… " : "";
    const suffix = truncatedAfter ? " …" : "";

    return (prefix + body + suffix).replace(/\s+/g, " ").trim();
  }

  function buildExcerptHtml(excerpt) {
    const { rawText, sliceStart, sliceEnd, spanStart, spanEnd, truncatedBefore, truncatedAfter } = excerpt;

    let body;

    if (spanStart === -1 || spanEnd <= sliceStart || spanStart >= sliceEnd) {
      body = escapeHtml(rawText.slice(sliceStart, sliceEnd));
    } else {
      const s = Math.max(spanStart, sliceStart);
      const e = Math.min(spanEnd, sliceEnd);

      body =
        escapeHtml(rawText.slice(sliceStart, s)) +
        `<span style="background-color:#fde047;mso-highlight:yellow;color:#111827;` +
        `padding:0 1px;-webkit-print-color-adjust:exact;print-color-adjust:exact;">` +
        `${escapeHtml(rawText.slice(s, e))}</span>` +
        escapeHtml(rawText.slice(e, sliceEnd));
    }

    const prefix = truncatedBefore ? "… " : "";
    const suffix = truncatedAfter ? " …" : "";

    return (prefix + body + suffix).replace(/\s+/g, " ").trim();
  }

  function formatShareLink(label, url) {
    return `[${label}](${url})`;
  }

  function downloadTextFile(filename, content, mimeType) {
    const blob = new Blob([content], { type: mimeType || "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function loadBookmarks() {

  function parseTagsInput(raw) {
    return Array.from(new Set(
      (raw || "").split(/[،,]+/).map(tag => tag.trim()).filter(Boolean)
    ));
  }

  function getAllBookmarkTags(list) {
    const tags = new Set();
    list.forEach(item => (item.tags || []).forEach(tag => tags.add(tag)));
    return Array.from(tags).sort((a, b) => a.localeCompare(b, "fa"));
  }

  const bookmarkFilterTags = new Set();

  function addSelectedToBookmarks(tags) {
    const selected = getSelectedMatchesInOrder();

    if (selected.length === 0) {
      return;
    }

    const bookmarks = loadBookmarks();
    const title = pdfTitleEl.textContent || document.title;

    selected.forEach(m => {
      bookmarks.push({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        title,
        text: buildExcerptPlainText(buildMatchExcerpt(m)),
        url: buildMatchUrl(m),
        tags: Array.isArray(tags) ? tags : [],
        links: [],
        occurrenceIndex: 1,
        savedAt: new Date().toISOString()
      });
    });

    saveBookmarks(bookmarks);
    renderSettingsMenu();
  }

  function removeBookmark(id) {
    saveBookmarks(loadBookmarks().filter(item => item.id !== id));
    renderBookmarksPanel();
  }

  function clearBookmarks() {
    saveBookmarks([]);
    renderBookmarksPanel();
  }

  function renderBookmarksPanel() {
    const panel = document.getElementById("bookmarksPanel");

    if (!panel) {
      return;
    }

    const all = loadBookmarks().slice().reverse();
    const allTags = getAllBookmarkTags(all);

    Array.from(bookmarkFilterTags).forEach(tag => {
      if (!allTags.includes(tag)) {
        bookmarkFilterTags.delete(tag);
      }
    });

    const items = bookmarkFilterTags.size > 0 ?
      all.filter(item => (item.tags || []).some(tag => bookmarkFilterTags.has(tag))) :
      all;

    const tagChipsHtml = allTags.length === 0 ? "" : `
      <div class="bookmark-tag-filter">
        ${allTags.map(tag => `
          <button
            type="button"
            class="bookmark-tag-chip${bookmarkFilterTags.has(tag) ? " is-active" : ""}"
            data-bookmark-filter-tag="${escapeHtml(tag)}">
            ${escapeHtml(tag)}
          </button>
        `).join("")}
      </div>
    `;

    const groups = new Map();

    items.forEach(item => {
      const title = item.title || "بدون عنوان";
      if (!groups.has(title)) groups.set(title, []);
      groups.get(title).push(item);
    });

    const titles = [...groups.keys()].sort((a, b) => a.localeCompare(b, "fa"));

    const listHtml = items.length === 0 ?
      `<p class="archive-empty">${
        bookmarkFilterTags.size > 0 ? "نشانه‌ای با این برچسب‌ها یافت نشد." : "هنوز نشانه‌ای ذخیره نشده است."
      }</p>` :
      titles.map(title => `
        <div class="archive-book-group-title">📘 ${escapeHtml(title)} (${groups.get(title).length})</div>
        ${groups.get(title).map(item => `
          <div class="archive-item">
            ${(item.tags && item.tags.length > 0) ? `
              <div class="archive-item-tags">
                ${item.tags.map(tag => `<span class="archive-item-tag">${escapeHtml(tag)}</span>`).join("")}
              </div>
            ` : ""}
            <p class="archive-item-text">"${escapeHtml(item.text || "")}"</p>
            <div class="archive-item-actions">
              <a href="${escapeHtml(item.url || "#")}" target="_blank" rel="noopener">بازکردن</a>
              <button type="button" data-bookmark-id="${escapeHtml(item.id)}">حذف</button>
            </div>
          </div>
        `).join("")}
      `).join("");

    panel.innerHTML = `
      <div class="archive-header">
        <span>نشانه‌ها (${items.length})</span>
        <div class="archive-header-actions">
          <button type="button" id="bookmarksClearButton">پاک‌کردن همه</button>
          <button type="button" id="bookmarksCloseButton">بستن</button>
        </div>
      </div>
      ${tagChipsHtml}
      ${listHtml}
    `;

    const clearButton = panel.querySelector("#bookmarksClearButton");
    if (clearButton) {
      clearButton.addEventListener("click", clearBookmarks);
    }

    const closeButton = panel.querySelector("#bookmarksCloseButton");
    if (closeButton) {
      closeButton.addEventListener("click", closeBookmarksPanel);
    }

    panel.querySelectorAll("[data-bookmark-id]").forEach(button => {
      button.addEventListener("click", () => {
        removeBookmark(button.dataset.bookmarkId);
      });
    });

    panel.querySelectorAll("[data-bookmark-filter-tag]").forEach(button => {
      button.addEventListener("click", () => {
        const tag = button.dataset.bookmarkFilterTag;

        if (bookmarkFilterTags.has(tag)) {
          bookmarkFilterTags.delete(tag);
        } else {
          bookmarkFilterTags.add(tag);
        }

        renderBookmarksPanel();
      });
    });
  }

    renderBookmarksPanel();
    document.getElementById("bookmarksOverlay").classList.add("open");
  }

    document.getElementById("bookmarksOverlay").classList.remove("open");

  // ---- Item جدید: پاپ‌آور برچسب («افزودن نشانه به انتخاب‌شده‌ها») ----
  function openTagPopover(rect) {
    const popover = document.getElementById("tagPopover");
    const input = document.getElementById("tagInput");

    if (!popover) {
      return;
    }

    if (input) {
      input.value = "";
    }

    popover.classList.add("is-open");

    if (rect) {
      const popoverRect = popover.getBoundingClientRect();
      let left = rect.right - popoverRect.width;
      left = Math.max(8, Math.min(left, window.innerWidth - popoverRect.width - 8));
      let top = rect.bottom + 6;

      if (top + popoverRect.height > window.innerHeight - 8) {
        top = rect.top - popoverRect.height - 6;
      }

      popover.style.left = left + "px";
      popover.style.top = Math.max(8, top) + "px";
    }

    if (input) {
      input.focus();
    }
  }

  function closeTagPopover() {
    const popover = document.getElementById("tagPopover");
    if (popover) {
      popover.classList.remove("is-open");
    }
  }

  const tagSaveButton = document.getElementById("tagSave");
  if (tagSaveButton) {
    tagSaveButton.addEventListener("click", event => {
      event.stopPropagation();
      const input = document.getElementById("tagInput");
      const tags = parseTagsInput(input ? input.value : "");
      addSelectedToBookmarks(tags);
      closeTagPopover();
    });
  }

  const tagCancelButton = document.getElementById("tagCancel");
  if (tagCancelButton) {
    tagCancelButton.addEventListener("click", event => {
      event.stopPropagation();
      closeTagPopover();
    });
  }

  const tagPopoverEl = document.getElementById("tagPopover");
  if (tagPopoverEl) {
    tagPopoverEl.addEventListener("click", event => event.stopPropagation());
  }

  document.addEventListener("click", event => {
    const popover = document.getElementById("tagPopover");

    if (
      popover &&
      popover.classList.contains("is-open") &&
      event.target !== popover &&
      !popover.contains(event.target)
    ) {
      closeTagPopover();
    }
  });
