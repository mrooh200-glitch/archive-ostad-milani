      <div class="settings-section-label">مرتب‌سازی نتایج</div>
      <label class="settings-radio" title="نتایج را به همان ترتیبی که در PDF ظاهر شده‌اند نشان بده">
        <input type="radio" name="sortMode" value="position" ${resultsSortMode === "position" ? "checked" : ""}>
        بر اساس محل وقوع
      </label>
      <label class="settings-radio" title="نتایجی را که بیشتر تکرار شده‌اند اول نشان بده">
        <input type="radio" name="sortMode" value="frequency" ${resultsSortMode === "frequency" ? "checked" : ""}>
        پرتکرارترین
      </label>

      <div class="settings-separator"></div>

      <div class="settings-section-label">جست‌وجوی پیشرفته</div>
      <label class="settings-checkbox" title="کلمات عبارت جست‌وجو لازم نیست کنار هم بیایند">
        <input type="checkbox" id="menuProximityToggle" ${proximitySearchEnabled ? "checked" : ""}>
        جست‌وجوی مجاورتی (حداکثر فاصله:
        <input type="number" id="menuProximityDistance" class="settings-proximity-distance" min="1" max="30" value="${proximityDistance}">
        کلمه)
      </label>

      <div class="settings-separator"></div>

      <div class="settings-section-label">نمایش صفحه</div>
      <div class="reading-size-row">
        <button type="button" id="readingZoomOut" title="کوچک‌کردن متن">A-</button>
        <span id="readingZoomLabel" class="reading-size-label">${Math.round(readingPrefs.zoom * 100)}٪</span>
        <button type="button" id="readingZoomIn" title="بزرگ‌کردن متن">A+</button>
        <button type="button" id="readingZoomReset" title="بازگشت به اندازهٔ پیش‌فرض">⟲</button>
      </div>
    `;

    const bind = (id, handler) => {
      const el = menu.querySelector(`#${id}`);
      if (el) el.addEventListener("click", handler);
    };

    bind("menuSelectAll", () => {
      selectAllVisibleMatches();
      closeSettingsMenu();
    });
    bind("menuClearSelection", () => {
      clearMatchSelection();
      closeSettingsMenu();
    });
    bind("menuRemoveSelected", () => {
      removeSelectedMatches();
      closeSettingsMenu();
    });
    bind("menuOpenArchive", () => {
      openArchivePanel();
      closeSettingsMenu();
    });
    bind("menuAddToArchive", () => {
      addSelectedToArchive();
    });
    bind("menuOpenBookmarks", () => {
      openBookmarksPanel();
      closeSettingsMenu();
    });
    bind("menuAddToBookmarks", event => {
      if (event) event.stopPropagation();
      const gear = document.getElementById("settingsGear");
      openTagPopover(gear ? gear.getBoundingClientRect() : null);
      closeSettingsMenu();
    });
    bind("menuCopySelected", () => {
      handleCopySelectedMatches();
    });
    bind("menuExportText", () => {
      exportSelectedAsText();
      closeSettingsMenu();
    });
    bind("menuExportWord", () => {
      exportSelectedAsWord();
      closeSettingsMenu();
    });
    bind("menuExportPdf", () => {
      exportSelectedAsPdf();
      closeSettingsMenu();
    });

    menu.querySelectorAll('input[name="sortMode"]').forEach(radio => {
      radio.addEventListener("change", () => {
        if (!radio.checked) return;
        resultsSortMode = radio.value;
        matches = sortMatchesForDisplay(matches);
        renderResultsPanel();
      });
    });

    const proximityToggle = menu.querySelector("#menuProximityToggle");
    const proximityDistanceInput = menu.querySelector("#menuProximityDistance");

    if (proximityToggle) {
      proximityToggle.addEventListener("change", () => {
        proximitySearchEnabled = proximityToggle.checked;
        if (searchInput.value.trim()) {
          performSearch(searchInput.value);
        }
      });
    }

    if (proximityDistanceInput) {
      proximityDistanceInput.addEventListener("click", event => event.stopPropagation());
      proximityDistanceInput.addEventListener("change", () => {
        const parsed = parseInt(proximityDistanceInput.value, 10);
        proximityDistance = Number.isInteger(parsed) && parsed > 0 ? parsed : 5;
        proximityDistanceInput.value = proximityDistance;

        if (proximitySearchEnabled && searchInput.value.trim()) {
          performSearch(searchInput.value);
        }
      });
    }

    bind("readingZoomOut", () => {
      readingPrefs.zoom = Math.max(READING_ZOOM_MIN, Math.round((readingPrefs.zoom - READING_ZOOM_STEP) * 100) / 100);
      saveReadingPrefs(readingPrefs);
      applyReadingPrefs();
    });
    bind("readingZoomIn", () => {
      readingPrefs.zoom = Math.min(READING_ZOOM_MAX, Math.round((readingPrefs.zoom + READING_ZOOM_STEP) * 100) / 100);
      saveReadingPrefs(readingPrefs);
      applyReadingPrefs();
    });
    bind("readingZoomReset", () => {
      readingPrefs.zoom = 1;
      saveReadingPrefs(readingPrefs);
      applyReadingPrefs();
    });

    if (menu.classList.contains("is-open")) {
      positionSettingsMenu();
    }
  }

  let settingsMenuReflowHandler = null;

  function positionSettingsMenu() {
    const menu = document.getElementById("settingsMenu");
    const gear = document.getElementById("settingsGear");

    if (!menu || !gear || !menu.classList.contains("is-open")) {
      return;
    }

    const GAP = 6;
    const EDGE_MARGIN = 8;
    const MIN_USABLE = 200;

    const gearRect = gear.getBoundingClientRect();
    const spaceBelow = window.innerHeight - gearRect.bottom - GAP - EDGE_MARGIN;
    const spaceAbove = gearRect.top - GAP - EDGE_MARGIN;
    const openUpward = spaceBelow < MIN_USABLE && spaceAbove > spaceBelow;

    menu.style.left = gearRect.left + "px";

    if (openUpward) {
      menu.style.top = "auto";
      menu.style.bottom = (window.innerHeight - gearRect.top + GAP) + "px";
    } else {
      menu.style.top = (gearRect.bottom + GAP) + "px";
      menu.style.bottom = "auto";
    }

    const available = Math.max(openUpward ? spaceAbove : spaceBelow, MIN_USABLE);
    menu.style.maxHeight = available + "px";
  }

  function openSettingsMenu() {
    const menu = document.getElementById("settingsMenu");
    const gear = document.getElementById("settingsGear");

    if (!menu) return;

    renderSettingsMenu();
    menu.classList.add("is-open");
    positionSettingsMenu();

    if (gear) gear.setAttribute("aria-expanded", "true");

    if (!settingsMenuReflowHandler) {
      settingsMenuReflowHandler = () => positionSettingsMenu();
      window.addEventListener("resize", settingsMenuReflowHandler);
      window.addEventListener("scroll", settingsMenuReflowHandler, true);
    }
  }

  function closeSettingsMenu() {
    const menu = document.getElementById("settingsMenu");
    const gear = document.getElementById("settingsGear");

    if (menu) {
      menu.classList.remove("is-open");
      menu.style.maxHeight = "";
      menu.style.left = "";
      menu.style.top = "";
      menu.style.bottom = "";
    }

    if (gear) gear.setAttribute("aria-expanded", "false");

    if (settingsMenuReflowHandler) {
      window.removeEventListener("resize", settingsMenuReflowHandler);
      window.removeEventListener("scroll", settingsMenuReflowHandler, true);
      settingsMenuReflowHandler = null;
    }
  }

  const settingsGearButton = document.getElementById("settingsGear");

  if (settingsGearButton) {
    settingsGearButton.addEventListener("click", event => {
      event.stopPropagation();
      const menu = document.getElementById("settingsMenu");

      if (menu && menu.classList.contains("is-open")) {
        closeSettingsMenu();
      } else {
        openSettingsMenu();
      }
    });
  }

  document.addEventListener("click", event => {
    const menu = document.getElementById("settingsMenu");
    const gear = document.getElementById("settingsGear");

    if (
      menu &&
      menu.classList.contains("is-open") &&
      !menu.contains(event.target) &&
      event.target !== gear
    ) {
      closeSettingsMenu();
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      closeSettingsMenu();
      closeTagPopover();
    }
  });

  function performSearch(query) {
    clearHighlights();

    if (!documentIndex) {
      rootBaseResults = [];
      activeDerivativeKeys.clear();
      renderDerivativesBlock();
      updateButtons();
      updateStatus();
      renderResultsPanel();
      return;
    }

    const { text, map } = documentIndex;
    let ranges = [];

    if (proximitySearchEnabled) {
      const proximityWords = getProximityQueryWords(query);

      if (proximityWords.length > 0) {
        ranges = findProximityRanges(text, proximityWords, proximityDistance);
      }
    } else if (isRootSearchEnabled()) {
      const queryStems = getQueryStems(query);

      if (queryStems.length > 0) {
        WORD_PATTERN.lastIndex = 0;
        let match;

        while ((match = WORD_PATTERN.exec(text)) !== null) {
          const wordStem = stemWord(match[0]);

          if (wordStem && queryStems.includes(wordStem)) {
            ranges.push({
              start: match.index,
              end: match.index + match[0].length
            });
          }
        }
      }
    } else if (normalize(query)) {
      const patternSource = buildFlexiblePattern(query);

      if (patternSource) {
        const pattern = new RegExp(patternSource, "gi");
        let match;

        while ((match = pattern.exec(text)) !== null) {
          if (match[0].length === 0) {
            pattern.lastIndex++;
            continue;
          }

          ranges.push({
            start: match.index,
            end: match.index + match[0].length
          });
        }
      }
    }

    const isRoot = !proximitySearchEnabled && isRootSearchEnabled();

    ranges.forEach(range => {
      const marks = highlightRangeOnSpans(map, range.start, range.end);

      if (marks.length === 0) return;

      const matchedWord = text.slice(range.start, range.end);
      const matchedWordKey = getVisualWordKey(matchedWord);

      matches.push({
        pageNumber: getPageNumberForRange(map, range.start, range.end),
        marks,
        start: range.start,
        end: range.end,
        sortKey: isRoot ? matchedWordKey : normalize(matchedWord),
        matchedWords: isRoot ? [matchedWord] : [],
        matchedWordKeys: isRoot ? [matchedWordKey] : [],
        snippetHtml: buildSnippetHtml(text, range.start, range.end),
        snippetPlainText: getSnippetPlainText(text, range.start, range.end)
      });
    });

    activeDerivativeKeys.clear();
    rootBaseResults = isRoot ? matches.slice() : [];

    matches = sortMatchesForDisplay(matches);

    renderDerivativesBlock();
    renderResultsPanel();

    if (matches.length > 0) {
      showMatch(0);
    } else {
      updateStatus();
    }

    updateButtons();
  }

  function showMatch(index) {
    if (matches.length === 0) return;

    matches.forEach(m => {
      m.marks.forEach(mark => mark.classList.remove("current-match"));
    });

    currentMatch = (index + matches.length) % matches.length;
    const active = matches[currentMatch];

    active.marks.forEach(mark => mark.classList.add("current-match"));

    // ابتدا اسکرول داخلیِ خودِ پنل نتایج، سپس اسکرول صفحهٔ اصلی - تا این
    // دو مزاحم هم نشوند.
    updateResultsPanelActiveState();

    // یک فریم صبر می‌کنیم تا هر تغییر layout ناشی از classList بالا (و
    // به‌خصوص، بعد از رندر پشت‌سرهم چند صد صفحهٔ PDF) قطعاً قبل از
    // محاسبهٔ موقعیت اعمال شده باشد.
    requestAnimationFrame(() => {
      scrollWindowToElement(active.marks[0]);
    });

    updateStatus();
  }

  function updateButtons() {
    const enabled = matches.length > 0;
    prevButton.disabled = !enabled;
    nextButton.disabled = !enabled;
  }

  function updateStatus() {
    if (!searchInput.value.trim()) {
      searchStatus.textContent = "";
      return;
    }

    if (matches.length === 0) {
      searchStatus.textContent = "عبارتی پیدا نشد.";
      return;
    }

    const pageSuffix = matches[currentMatch].pageNumber ?
      ` — صفحهٔ ${matches[currentMatch].pageNumber}` : "";

    searchStatus.textContent =
      `نتیجهٔ ${currentMatch + 1} از ${matches.length}${pageSuffix}`;
  }

  function clearSearch() {
    searchInput.value = "";
    clearHighlights();
    updateButtons();
    updateStatus();
    renderResultsPanel();
  }

  function applyIncomingQueryFromUrl() {
    const incomingQuery = params.get("q");

    if (!incomingQuery) return;

    searchInput.value = incomingQuery;

    if (rootToggle && params.get("root") === "1") {
      rootToggle.checked = true;
    }

    // Item جدید (رفع اشکال بحرانی): درست مثل applyIncomingPageHash که
    // قبلاً همین‌جا با یک تأخیر کوچک درست شده بود، این‌جا هم بلافاصله
    // بعد از رندر پشت‌سرهم چند صد صفحهٔ PDF، به مرورگر کمی مهلت
    // می‌دهیم تا layout واقعاً نهایی/settle شود، قبل از اینکه
    // performSearch → showMatch بخواهد موقعیت اسکرول را محاسبه کند.
    setTimeout(() => {
      performSearch(incomingQuery);
    }, 60);
  }

  let searchTimer;

  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => performSearch(searchInput.value), 250);

    if (searchInput.value.trim()) {
      closeSearchHistoryDropdown();
    } else {
      openSearchHistoryDropdown();
    }
  });

  searchInput.addEventListener("focus", openSearchHistoryDropdown);
  searchInput.addEventListener("mouseenter", openSearchHistoryDropdown);
  searchInput.addEventListener("mouseleave", scheduleSearchHistoryHoverClose);
  searchInput.addEventListener("blur", closeSearchHistoryDropdown);

  const searchHistoryDropdownEl = document.getElementById("searchHistory");

  if (searchHistoryDropdownEl) {
    searchHistoryDropdownEl.addEventListener("mouseenter", cancelSearchHistoryHoverClose);
    searchHistoryDropdownEl.addEventListener("mouseleave", scheduleSearchHistoryHoverClose);
  }

  document.addEventListener("click", event => {
    const dropdown = document.getElementById("searchHistory");

    if (
      dropdown &&
      dropdown.classList.contains("is-open") &&
      !dropdown.contains(event.target) &&
      event.target !== searchInput
    ) {
      closeSearchHistoryDropdown();
    }
  });

  searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      closeSearchHistoryDropdown();

      if (searchInput.value.trim()) {
        pushSearchHistory(searchInput.value);
      }

      if (event.shiftKey) {
        showMatch(currentMatch - 1);
      } else {
        showMatch(currentMatch + 1);
      }
    }
    if (event.key === "Escape") {
      closeSearchHistoryDropdown();
      clearSearch();
    }
  });

  prevButton.addEventListener("click", () => showMatch(currentMatch - 1));
  nextButton.addEventListener("click", () => showMatch(currentMatch + 1));

  const voiceInputButton = document.getElementById("voiceInputButton");
  if (voiceInputButton) {
    if (!getSpeechRecognitionCtor()) {
      voiceInputButton.disabled = true;
      voiceInputButton.title = "مرورگر شما از جست‌وجوی صوتی پشتیبانی نمی‌کند";
    }
    voiceInputButton.addEventListener("click", toggleVoiceInput);
  }

  rootToggle.addEventListener("change", () => {
    updateShowDerivativesVisibility();

    const showDerivativesToggle = document.getElementById("showDerivatives");
    if (!rootToggle.checked && showDerivativesToggle) {
      showDerivativesToggle.checked = false;
    }

    if (searchInput.value.trim()) {
      performSearch(searchInput.value);
    } else {
      renderDerivativesBlock();
    }
  });

  const showDerivativesToggleEl = document.getElementById("showDerivatives");

  if (showDerivativesToggleEl) {
    showDerivativesToggleEl.addEventListener("change", () => {
      if (!showDerivativesToggleEl.checked) {
        activeDerivativeKeys.clear();

        if (isRootSearchEnabled()) {
          matches = sortMatchesForDisplay(rootBaseResults);
          currentMatch = -1;
          selectedMatchIndexes.clear();
          renderResultsPanel();
        }
      }

      renderDerivativesBlock();
    });
  }

  updateShowDerivativesVisibility();

  // ---- Item جدید: نمایش/پنهان‌کردن گزینه‌ها («⋯») --------------------
  // از همون کلید localStorage نسخهٔ in-page-search.js استفاده می‌شود تا
  // این ترجیح در کل سایت (چه صفحات html، چه همین نمایشگر PDF) یکسان
  // بماند.
  if (optionsToggle && extraControls) {
    let optionsVisible = false;

    try {
      optionsVisible = localStorage.getItem("milaniInPageOptionsVisible") === "1";
    } catch (error) {
      // Storage unavailable - default to hidden.
    }

    const applyOptionsVisibility = () => {
      extraControls.classList.toggle("is-visible", optionsVisible);
      optionsToggle.classList.toggle("is-active", optionsVisible);
      optionsToggle.setAttribute("aria-expanded", optionsVisible ? "true" : "false");
    };

    applyOptionsVisibility();

    optionsToggle.addEventListener("click", () => {
      optionsVisible = !optionsVisible;
      applyOptionsVisibility();

      try {
        localStorage.setItem("milaniInPageOptionsVisible", optionsVisible ? "1" : "0");
      } catch (error) {
        // Storage unavailable - the choice just won't persist.
      }

      reserveScrollOffsetForStickyBox();
    });
  }

  window.addEventListener("resize", reserveScrollOffsetForStickyBox);

  document.addEventListener("keydown", event => {
    const isMac = navigator.platform.toUpperCase().includes("MAC");
    const isFindShortcut = isMac ?
      (event.metaKey && event.key.toLowerCase() === "f") :
      (event.ctrlKey && event.key.toLowerCase() === "f");

    if (isFindShortcut && searchBox.style.display !== "none") {
      event.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;

    const arrayBuffer = await file.arrayBuffer();

    if (!titleParam) {
      document.title = file.name.replace(/\.pdf$/i, "");
    }

    loadPdf(new Uint8Array(arrayBuffer));
  });

  if (fileParam) {
    loadPdf(fileParam);
  }
})();
</script>
</body>
</html>
