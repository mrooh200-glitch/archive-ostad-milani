<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>در حال انتقال...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      color: #1f2937;
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.9;
    }

    .box {
      width: min(480px, calc(100% - 32px));
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.15rem;
      color: #173b63;
    }

    p {
      margin: 0 0 16px;
      color: #475569;
      font-size: 0.95rem;
    }

    a.manual-link {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 16px;
      border: 3px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div id="loadingState">
      <div class="spinner"></div>
      <p>در حال انتقال به منبع مورد نظر...</p>
    </div>

    <div id="errorState" class="hidden">
      <h1>لینک نامعتبر است</h1>
      <p>این لینک کوتاه قابل بازخوانی نبود. ممکن است هنگام کپی یا ارسال، بخشی از آن بریده یا تغییر داده شده باشد.</p>
      <a class="manual-link" href="index.htm">بازگشت به صفحه اصلی</a>
    </div>
  </div>

  <script>
    // Reverses encodeShortLinkPayload() from index.htm / in-page-search.js:
    // base64 (URL-safe alphabet) over raw UTF-8 bytes of a small JSON
    // payload, back into the payload object.
    function decodeShortLinkPayload(encoded) {
      let base64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
      while (base64.length % 4) {
        base64 += "=";
      }

      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      const json = new TextDecoder().decode(bytes);
      return JSON.parse(json);
    }

    // Rebuilds the original, full URL from the compact payload,
    // re-applying normal percent-encoding only at this final step.
    function expandPayloadToUrl(payload) {
      if (!payload || typeof payload.p !== "string") {
        throw new Error("Invalid payload");
      }

      const target = new URL(payload.p, location.origin);

      if (Array.isArray(payload.q) && payload.q.length) {
        const params = new URLSearchParams();
        payload.q.forEach(entry => {
          if (Array.isArray(entry) && entry.length === 2) {
            const [key, value] = entry;
            // `true` is a placeholder meaning "same text as payload.t"
            // (see the encoding side) - restores the de-duplicated
            // sentence instead of storing it twice.
            const resolvedValue = value === true ? (payload.t || "") : value;
            params.append(key, resolvedValue);
          }
        });
        target.search = params.toString();
      }

      if (typeof payload.t === "string" && payload.t) {
        target.hash = `:~:text=${encodeURIComponent(payload.t)}`;
      } else if (typeof payload.h === "string" && payload.h) {
        target.hash = payload.h.replace(/^#/, "");
      }

      return target.href;
    }

    function showError() {
      document.getElementById("loadingState").classList.add("hidden");
      document.getElementById("errorState").classList.remove("hidden");
    }

    (function redirect() {
      const encoded = location.hash ? location.hash.slice(1) : "";

      if (!encoded) {
        showError();
        return;
      }

      try {
        const payload = decodeShortLinkPayload(encoded);
        const targetUrl = expandPayloadToUrl(payload);
        location.replace(targetUrl);
      } catch (error) {
        showError();
      }
    })();
  </script>
</body>
</html>
